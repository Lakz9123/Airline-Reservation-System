<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Forgot Password')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow border-0 mt-5">
        <div class="card-body p-4">
          <h3 class="text-center mb-4 fw-bold">Forgot Password</h3>
          <p class="text-muted text-center mb-4">Enter your email address and we'll send you a link to reset your password.</p>

          <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
          <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

          <form th:action="@{/forgot-password}" method="post">
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">Send Reset Link</button>
            </div>
          </form>
        </div>
      </div>
      <div class="text-center mt-3">
        <a th:href="@{/login}" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Login</a>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
