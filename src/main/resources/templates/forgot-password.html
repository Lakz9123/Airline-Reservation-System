<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8"/>

    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#e3effb",
                        "secondary-fixed-dim": "#a5c8ff",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-background": "#111d25",
                        "on-tertiary": "#ffffff",
                        "surface-container-highest": "#d8e4f0",
                        "secondary": "#005cab",
                        "outline": "#74777d",
                        "on-surface": "#111d25",
                        "surface": "#f6faff",
                        "surface-bright": "#f6faff",
                        "on-tertiary-fixed": "#1a1c1c",
                        "primary": "#000000",
                        "on-tertiary-container": "#838484",
                        "tertiary": "#000000",
                        "error": "#ba1a1a",
                        "secondary-container": "#0075d6",
                        "on-secondary-container": "#fefcff",
                        "on-primary-container": "#778598",
                        "surface-container-low": "#ebf5ff",
                        "surface-variant": "#d8e4f0",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#525f71",
                        "inverse-on-surface": "#e6f2fe",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#454747",
                        "inverse-primary": "#bac8dc",
                        "inverse-surface": "#26323b",
                        "surface-dim": "#cfdce7",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#44474c",
                        "on-secondary-fixed": "#001c3a",
                        "outline-variant": "#c4c6cc",
                        "on-secondary-fixed-variant": "#004786",
                        "tertiary-container": "#1a1c1c",
                        "primary-container": "#0f1c2c",
                        "primary-fixed": "#d6e4f9",
                        "on-primary-fixed-variant": "#3a4859",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "background": "#f6faff",
                        "secondary-fixed": "#d4e3ff",
                        "surface-container-high": "#ddeaf5",
                        "primary-fixed-dim": "#bac8dc",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#e2e2e2",
                        "on-primary-fixed": "#0f1c2c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "container-max": "1280px",
                        "margin-desktop": "64px",
                        "gutter": "24px",

                    "fontFamily": {

                    "fontSize": {

                        "label-sm": ["13px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],

                    "boxShadow": {
                        'ambient': '0px 4px 20px rgba(0,0,0,0.05)',

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Ambient Background Animation */
        @keyframes ambient-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animate-ambient-bg {
            background-size: 200% 200%;
            animation: ambient-bg 15s ease infinite;
        }

        /* Floating Card Effect */
        @keyframes float-card {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float-card 6s ease-in-out infinite;
        }

        /* Entrance Stagger Animation */
        @keyframes fade-slide-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .stagger-item {
            opacity: 0;
            animation: fade-slide-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }
        .stagger-6 { animation-delay: 0.6s; }

        /* Shimmer Button Effect */
        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }
        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(30deg) translate(-100%, -100%);
            animation: shimmer 4s infinite;
        }
        @keyframes shimmer {
            0% { transform: rotate(30deg) translate(-100%, -100%); }
            15% { transform: rotate(30deg) translate(100%, 100%); }
            100% { transform: rotate(30deg) translate(100%, 100%); }
        }

        /* Particle Layer */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float-particle linear infinite;
        }
        @keyframes float-particle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface relative z-0" style="background-image: linear-gradient(rgba(0, 92, 171, 0.15), rgba(0, 92, 171, 0.15)), url('https://lh3.googleusercontent.com/aida-public/AB6AXuA1D6xTGme6mV9S7yfawJ04GR5LWWB8t5OcBFyR8yQWvAXkm2SEca3eFKoOrz_7oFOaSIM8AdClFOQ19m4WfZkUDeiqr-657-WL68pYGJlTx64PY0WUpnt8ruDD9NWrz8aBvpJY_0UVBZveyxFGTqWCHc4tajF9YFQi4MWI9905WATmh3eM6OjYmQsAltyvPXoWfiVawCJbd0YLJpPG4LASeC4ICKUGJzNMnmFapgh3217OoeG6rzUjVQ'); background-size: cover; background-position: center; background-attachment: fixed;">
<!-- Particles Container -->
<div id="particles"></div>
<div class="w-full max-w-md relative z-10">
    <!-- Brand Logo Area -->
    <div class="text-center mb-8 flex justify-center items-center gap-2 stagger-item stagger-1">
        <span class="material-symbols-outlined text-secondary text-3xl" style="font-variation-settings: 'FILL' 1;">flight_takeoff</span>
        <span class="font-headline-md text-headline-md text-secondary tracking-tight">SkyFly <span class="bg-primary-container text-on-primary-container text-xs px-2 py-1 rounded-sm ml-1 align-middle">ELITE</span></span>
    </div>
    <!-- Forgot Password Card -->
    <div class="bg-surface-container-lowest rounded-[16px] shadow-ambient border border-outline-variant/30 p-8 mb-8 transition-all duration-300 relative overflow-hidden animate-float">
        <!-- Decorative top accent -->
        <div class="absolute top-0 left-0 w-full h-1 bg-secondary"></div>
        <div class="text-center mb-8">
            <span class="font-label-sm text-label-sm text-secondary-container uppercase tracking-wider mb-2 block stagger-item stagger-2">Account Recovery</span>
            <h1 class="font-display-lg-mobile text-display-lg-mobile md:font-headline-md md:text-headline-md text-on-surface stagger-item stagger-3">Reset your password</h1>
            <p class="font-body-md text-body-md text-on-surface-variant mt-3 stagger-item stagger-4">We'll email you a secure link to reset your password.</p>
        </div>

        <!-- Banners -->
        <div th:if="${error}" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6 flex items-start gap-3 stagger-item stagger-4">
            <span class="material-symbols-outlined text-red-500 mt-0.5">error</span>
            <div class="text-sm text-red-700 flex-1" th:text="${error}">Error message</div>
        </div>
        <div th:if="${success}" class="bg-green-50 border border-green-200 rounded-lg p-4 mb-6 flex items-start gap-3 stagger-item stagger-4">
            <span class="material-symbols-outlined text-green-500 mt-0.5">check_circle</span>
            <div class="text-sm text-green-700 flex-1" th:text="${success}">Success message</div>
        </div>

        <form th:action="@{/forgot-password}" method="post" class="space-y-6 stagger-item stagger-5">
            <div>
                <label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="email">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <span class="material-symbols-outlined text-outline-variant">mail</span>
                    </div>
                    <input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg text-on-surface bg-surface-container-lowest focus:ring-2 focus:ring-[#1E90FF] focus:border-[#1E90FF] transition-colors placeholder:text-outline-variant/70 font-body-md text-body-md" id="email" name="email" placeholder="your.email@example.com" required="" type="email"/>
                </div>
            </div>
            <button class="w-full bg-[#1E90FF] hover:bg-secondary-container text-on-primary font-label-sm text-label-sm py-3 px-6 rounded-lg transition-colors flex items-center justify-center gap-2 group btn-shimmer" type="submit">
                 Send Reset Link
                 <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
            </button>
        </form>
        <div class="mt-6 text-center stagger-item stagger-6">
            <a class="font-label-sm text-label-sm text-secondary hover:text-secondary-container transition-colors inline-flex items-center gap-1" th:href="@{/login}">
                <span class="material-symbols-outlined text-sm">arrow_back</span>
                Back to Login
            </a>
        </div>
    </div>
    <div class="text-center text-on-surface-variant font-label-sm text-label-sm stagger-item stagger-6">
        <p>Need help? <a class="text-secondary hover:underline underline-offset-4" href="#">Contact Support</a></p>
    </div>
</div>
<!-- Particle System Script -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const particleContainer = document.getElementById('particles');
        const numParticles = 15;

        for (let i = 0; i < numParticles; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Randomize properties
            const size = Math.random() * 6 + 2; // 2px to 8px
            const left = Math.random() * 100;
            const duration = Math.random() * 10 + 10; // 10s to 20s
            const delay = Math.random() * 10;
            
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${left}%`;
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `${delay}s`;
            
            particleContainer.appendChild(particle);
        }
    });
</script>
</body>
</html>
