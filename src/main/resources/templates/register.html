<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — SkyFly Elite</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* ─── Design Tokens (Matches landing page exactly) ─── */
        :root {
            --sky:        #0284c7;
            --sky-light:  #0ea5e9;
            --sky-glow:   rgba(14, 165, 233, 0.08);
            --sky-dark:   #0369a1;
            --accent:     #f97316;
            --bg:         #f8fafc;
            --surface:    rgba(255, 255, 255, 0.75);
            --text:       #0f172a;
            --text-muted: #475569;
            --border:     rgba(15, 23, 24, 0.08);
            --shadow-sm:  0 1px 3px rgba(15,23,42,0.05);
            --shadow-md:  0 12px 30px -10px rgba(15, 23, 42, 0.08);
            --shadow-lg:  0 20px 40px -15px rgba(15, 23, 42, 0.12), 0 0 50px rgba(14, 165, 233, 0.04);
            --radius:     24px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            letter-spacing: -0.01em;
            height: 100vh;
        }

        /* Hero Airplane Background Wrapper */
        .auth-wrapper {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: url('https://images.unsplash.com/photo-1569154941061-e231b4725ef1?auto=format&fit=crop&w=1920&q=80') center center / cover no-repeat fixed;
            overflow: hidden;
        }
        .auth-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                rgba(248, 250, 252, 0.94) 0%,
                rgba(248, 250, 252, 0.82) 50%,
                rgba(14, 165, 233, 0.04) 100%);
            z-index: 1;
        }

        /* ─── Navbar ────────────────────────────────────── */
        .navbar-main {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
            position: relative;
            z-index: 10;
        }
        .navbar-brand {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.45rem;
            color: var(--text) !important;
            letter-spacing: -1.2px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: .6rem;
        }
        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--sky-light), var(--sky-dark));
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.2);
        }
        .brand-sky  { color: var(--text); }
        .brand-fly  { color: var(--sky-light); }
        .nav-link-item {
            color: var(--text-muted) !important;
            font-weight: 600;
            font-size: .88rem;
            padding: .4rem .9rem !important;
            border-radius: 10px;
            transition: all .3s ease;
        }
        .nav-link-item:hover {
            color: var(--sky-dark) !important;
            background: rgba(14, 165, 233, 0.05);
        }
        .btn-login-nav {
            color: var(--sky-dark);
            font-weight: 600;
            font-size: .88rem;
            background: transparent;
            border: 1.5px solid rgba(14, 165, 233, 0.3);
            border-radius: 12px;
            padding: .5rem 1.3rem;
            transition: all .3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-login-nav:hover {
            border-color: var(--sky-light);
            background: rgba(14, 165, 233, 0.05);
        }
        .btn-signup-nav {
            background: linear-gradient(135deg, var(--sky-light), var(--sky-dark));
            color: #fff;
            font-weight: 700;
            font-size: .88rem;
            border: none;
            border-radius: 12px;
            padding: .55rem 1.5rem;
            transition: all .3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.25);
        }
        .btn-signup-nav:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(14, 165, 233, 0.4);
            color: #fff;
        }

        /* ─── Auth Card Layout ───────────────────────────── */
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            position: relative;
            z-index: 5;
            overflow: hidden;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 1.8rem 2.2rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
            max-width: 460px;
            width: 100%;
            margin: auto;
        }
        .auth-card .form-label {
            font-size: .75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--sky-dark);
            margin-bottom: .3rem;
        }
        .auth-card .form-control {
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 12px;
            font-size: .88rem;
            padding: .55rem 1rem;
            color: var(--text);
            background: rgba(255, 255, 255, 0.6);
            transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .auth-card .form-control:focus {
            border-color: var(--sky-light);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
            background: #fff;
        }
        .btn-auth-primary {
            background: linear-gradient(135deg, var(--sky-light), var(--sky-dark));
            color: #fff;
            font-weight: 800;
            font-size: .92rem;
            letter-spacing: 1px;
            border: none;
            border-radius: 12px;
            padding: .7rem 1.5rem;
            width: 100%;
            transition: all .3s ease;
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.25);
        }
        .btn-auth-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.45);
            color: #fff;
        }
        .section-label {
            font-size: .7rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--sky-dark);
            margin-bottom: .1rem;
            display: block;
        }
        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -1px;
            color: var(--text);
            margin-bottom: 0.8rem;
        }

        /* ─── Simplified Footer ─── */
        .footer-mini {
            position: relative;
            z-index: 10;
            background: transparent;
            text-align: center;
            padding: 0.5rem 0;
            font-size: .8rem;
            color: var(--text-muted);
        }

        /* Responsive height fallback */
        @media (max-height: 720px) {
            body, .auth-wrapper { overflow: auto !important; height: auto !important; }
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-overlay"></div>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-main" id="mainNav">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <img src="/images/logo.png" alt="SkyFly Elite Logo" style="height: 40px; object-fit: contain;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    <li class="nav-item"><a class="nav-link nav-link-item" th:href="@{/#features}">Features</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-item" th:href="@{/#destinations}">Destinations</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-item" th:href="@{/#about}">About</a></li>
                    <li class="nav-item"><a class="btn-login-nav ms-2" th:href="@{/login}">Login</a></li>
                    <li class="nav-item"><a class="btn-signup-nav ms-2" th:href="@{/register}">Sign Up</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="auth-container">
        <div class="auth-card">
            <div class="text-center">
                <span class="section-label">Join SkyFly Elite</span>
                <h2 class="section-title">Create your account</h2>
            </div>

            <!-- Alert Notification -->
            <div th:if="${error}" class="alert alert-danger border-0 rounded-3 mb-2 py-1.5 small" role="alert" style="background: rgba(239, 68, 68, 0.08); color: #dc2626;">
                <i class="bi bi-exclamation-circle-fill me-2"></i>
                <span th:text="${error}">An error occurred</span>
            </div>

            <form th:action="@{/register}" method="post" id="registerForm">
                <div class="mb-2">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" required placeholder="John Doe" th:value="${name != null ? name : ''}" autofocus>
                </div>

                <div class="mb-2">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="you@example.com" th:value="${email != null ? email : ''}">
                </div>

                <div class="mb-2">
                    <label for="password" class="form-label">Password <span class="text-muted text-lowercase font-monospace small">(min 6 chars)</span></label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" name="password" required minlength="6" placeholder="Choose a password">
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword" style="border-color: rgba(15, 23, 42, 0.08); border-top-right-radius: 12px; border-bottom-right-radius: 12px; padding: 0 .75rem;">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required placeholder="Repeat password">
                    <div id="passwordMismatch" class="text-danger small mt-1 d-none">
                        <i class="bi bi-x-circle me-1"></i> Passwords do not match.
                    </div>
                </div>

                <button type="submit" class="btn-auth-primary" id="submitBtn">
                    Create Account <i class="bi bi-arrow-right-short ms-1"></i>
                </button>
            </form>

            <div class="text-center mt-3 pt-2 border-top" style="border-color: var(--border) !important;">
                <span class="text-muted small">Already have an account?</span>
                <a th:href="@{/login}" class="ms-1 fw-bold text-decoration-none" style="color: var(--sky);">Sign In</a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer-mini">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 SkyFly Elite. All rights reserved.</p>
        </div>
    </footer>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('togglePassword')?.addEventListener('click', function () {
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            toggleIcon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    });

    const pwd = document.getElementById('password');
    const confirmPwd = document.getElementById('confirmPassword');
    const mismatchAlert = document.getElementById('passwordMismatch');

    function checkMatch() {
        if (confirmPwd.value && pwd.value !== confirmPwd.value) {
            mismatchAlert.classList.remove('d-none');
        } else {
            mismatchAlert.classList.add('d-none');
        }
    }

    pwd?.addEventListener('input', checkMatch);
    confirmPwd?.addEventListener('input', checkMatch);
</script>
</body>
</html>
