<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Register')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow border-0 mt-5">
        <div class="card-body p-4">
          <h2 class="text-center mb-4 fw-bold text-primary"><i class="bi bi-person-plus-fill"></i> Create Account</h2>

          <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" th:text="${error}">
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <form th:action="@{/register}" method="post">
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="name" name="name" required placeholder="John Doe">
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password <small class="text-muted">(min 6 chars)</small></label>
              <input type="password" class="form-control" id="password" name="password" required placeholder="Password">
            </div>
            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required placeholder="Repeat password">
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-success btn-lg">Register</button>
            </div>
          </form>
        </div>
      </div>
      <div class="text-center mt-3">
        <span class="text-muted">Already have an account?</span>
        <a th:href="@{/login}" class="ms-1 fw-semibold">Sign in</a>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
