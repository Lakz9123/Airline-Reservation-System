<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Reset Password')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow border-0 mt-5">
        <div class="card-body p-4">
          <h3 class="text-center mb-4 fw-bold">Reset Password</h3>
          
          <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
          
          <th:block th:if="${token != null}">
            <p class="text-muted text-center mb-4">Please enter your new password below.</p>
            <form th:action="@{/reset-password}" method="post">
              <input type="hidden" name="token" th:value="${token}" />
              
              <div class="mb-3">
                <label for="password" class="form-label">New Password</label>
                <input type="password" class="form-control" id="password" name="password" required minlength="6" placeholder="Enter new password">
              </div>
              
              <div class="d-grid">
                <button type="submit" class="btn btn-success btn-lg">Update Password</button>
              </div>
            </form>
          </th:block>
          
          <th:block th:if="${token == null}">
             <div class="text-center mt-4">
                 <a th:href="@{/forgot-password}" class="btn btn-outline-primary">Request New Link</a>
             </div>
          </th:block>

        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
