<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('My Bookings')}"></head>
<body>
<div th:replace="~{layout :: user_navbar}"></div>
<main class="container">
  <h2 class="fw-bold mb-4"><i class="bi bi-journal-check text-primary"></i> My Bookings</h2>

  <div th:if="${success}" class="alert alert-success alert-dismissible fade show" th:text="${success}">
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" th:text="${error}">
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${bookingSuccess}" class="alert alert-success alert-dismissible fade show">
    <i class="bi bi-check-circle-fill"></i> Booking confirmed! Your seats have been reserved.
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- Empty state -->
  <div th:if="${#lists.isEmpty(bookings)}" class="text-center py-5">
    <i class="bi bi-journal-x display-1 text-muted"></i>
    <h4 class="mt-3 text-muted">No bookings yet</h4>
    <a th:href="@{/user/search}" class="btn btn-primary mt-2">Search Flights</a>
  </div>

  <!-- Bookings list -->
  <div th:each="b : ${bookings}" class="card border-0 shadow-sm mb-3">
    <div class="card-body">
      <div class="row align-items-center gy-2">
        <div class="col-12 col-md-1 text-center">
          <span class="badge rounded-pill bg-success fs-6 px-3" th:if="${b.status=='CONFIRMED'}">✓</span>
          <span class="badge rounded-pill bg-danger fs-6 px-3" th:if="${b.status=='CANCELLED'}">✗</span>
        </div>
        <div class="col-6 col-md-2">
          <div class="fw-bold" th:text="${b.flight.flightNumber}">FL-101</div>
          <div class="text-muted small" th:text="${b.flight.airline.airlineName}">Airline</div>
        </div>
        <div class="col-6 col-md-3">
          <strong th:text="${b.flight.originAirport.airportCode} + ' (' + ${b.flight.originAirport.city} + ')'">Origin</strong> → <strong th:text="${b.flight.destinationAirport.airportCode} + ' (' + ${b.flight.destinationAirport.city} + ')'">Dest</strong>
          <div class="text-muted small" th:text="${#temporals.format(b.flight.departureDateTime,'dd MMM yyyy HH:mm')}">Date</div>
        </div>
        <div class="col-6 col-md-2">
          <div class="text-muted small">Seats / Cabin</div>
          <code th:text="${b.seatNumbers}">A1, A2</code><br>
          <small class="badge bg-secondary mt-1" th:text="${b.cabinClass}">Economy</small>
        </div>
        <div class="col-6 col-md-2">
          <div class="text-muted small">Total Fare</div>
          <div class="fw-bold text-primary">$<span th:text="${#numbers.formatDecimal(b.totalFare,1,2)}">0</span></div>
        </div>
        <div class="col-6 col-md-1">
          <span class="badge rounded-pill bg-success px-3 py-2" th:if="${b.status=='CONFIRMED'}">CONFIRMED</span>
          <span class="badge rounded-pill bg-danger px-3 py-2" th:if="${b.status=='CANCELLED'}">CANCELLED</span>
        </div>
        <div class="col-12 col-md-1 text-md-end d-flex d-md-block gap-1 flex-wrap">
          <a th:if="${b.status=='CONFIRMED'}"
             th:href="@{/user/ticket/{id}(id=${b.id})}"
             class="btn btn-outline-primary btn-sm mb-1">
            <i class="bi bi-ticket-perforated"></i> Ticket
          </a>
          <a th:if="${b.status=='CONFIRMED'}"
             th:href="@{/user/ticket/{id}/download(id=${b.id})}"
             class="btn btn-success btn-sm mb-1">
            <i class="bi bi-file-earmark-pdf-fill"></i> PDF
          </a>
          <form th:if="${b.status=='CONFIRMED'}" th:action="@{/user/bookings/cancel/{id}(id=${b.id})}" method="post"
                onsubmit="return confirm('Cancel this booking? Your seats will be released.')">
            <button type="submit" class="btn btn-outline-danger btn-sm w-100">Cancel</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
