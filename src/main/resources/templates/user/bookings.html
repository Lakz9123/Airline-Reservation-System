<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('My Bookings')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container">
    <h2 class="fw-bold text-dark mb-4"><i class="bi bi-journal-bookmark-fill text-primary"></i> My Bookings</h2>

    <!-- Feedback alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}">Success message.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">Error message.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Bookings Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Booking ID</th>
                            <th>Flight No.</th>
                            <th>Route</th>
                            <th>Departure</th>
                            <th>Booked Seats</th>
                            <th>Booking Date</th>
                            <th>Total Cost</th>
                            <th>Status</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(bookings)}">
                            <td colspan="9" class="text-center py-4 text-muted">You haven't made any bookings yet. <a th:href="@{/}" class="text-decoration-none">Search flights and book now!</a></td>
                        </tr>
                        <tr th:each="booking : ${bookings}">
                            <td>#<span th:text="${booking.id}">0001</span></td>
                            <td><strong th:text="${booking.flight.flightNumber}">AA-101</strong></td>
                            <td>
                                <span class="fw-semibold text-uppercase" th:text="${booking.flight.origin}">Origin</span> 
                                <i class="bi bi-arrow-right text-muted mx-1"></i>
                                <span class="fw-semibold text-uppercase" th:text="${booking.flight.destination}">Destination</span>
                            </td>
                            <td th:text="${#temporals.format(booking.flight.departureDateTime, 'yyyy-MM-dd HH:mm')}">Departure Time</td>
                            <td th:text="${booking.numberOfSeats}">1</td>
                            <td th:text="${#temporals.format(booking.bookingDate, 'yyyy-MM-dd HH:mm')}">Booking Date</td>
                            <td>$<span th:text="${#numbers.formatDecimal(booking.numberOfSeats * booking.flight.price, 1, 2)}">0.00</span></td>
                            <td>
                                <span class="badge bg-success" th:if="${booking.status == 'CONFIRMED'}">CONFIRMED</span>
                                <span class="badge bg-danger" th:if="${booking.status == 'CANCELLED'}">CANCELLED</span>
                            </td>
                            <td class="text-center">
                                <form th:if="${booking.status == 'CONFIRMED'}" th:action="@{/booking/cancel}" method="post" onsubmit="return confirm('Are you sure you want to cancel this booking?');">
                                    <input type="hidden" name="bookingId" th:value="${booking.id}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-x-circle"></i> Cancel Booking
                                    </button>
                                </form>
                                <span th:if="${booking.status == 'CANCELLED'}" class="text-muted"><small>None</small></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
