<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('My Notifications')}"></head>
<style>
    .notif-card {
        border-left: 4px solid transparent;
        transition: all 0.2s ease;
        cursor: pointer;
    }
    .notif-card.unread {
        background: var(--sky-glow) !important;
        border-left-color: var(--sky-light);
    }
    .notif-card:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-md) !important;
    }

    .notif-icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        flex-shrink: 0;
    }
    .icon-FLIGHT_DELAYED    { background: #fff7ed; color: #f97316; }
    .icon-GATE_CHANGED      { background: #eff6ff; color: #3b82f6; }
    .icon-BOARDING_STARTED  { background: #f0fdf4; color: #22c55e; }
    .icon-FLIGHT_CANCELLED  { background: #fef2f2; color: #ef4444; }
    .icon-DEPARTURE_REMINDER{ background: #faf5ff; color: #a855f7; }

    .notif-type-badge {
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 2px 8px;
        border-radius: 999px;
    }
    .badge-FLIGHT_DELAYED    { background: #fff7ed; color: #ea580c; border: 1px solid #fdba74; }
    .badge-GATE_CHANGED      { background: #eff6ff; color: #2563eb; border: 1px solid #93c5fd; }
    .badge-BOARDING_STARTED  { background: #f0fdf4; color: #16a34a; border: 1px solid #86efac; }
    .badge-FLIGHT_CANCELLED  { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
    .badge-DEPARTURE_REMINDER{ background: #faf5ff; color: #9333ea; border: 1px solid #d8b4fe; }

    .empty-state { padding: 80px 20px; text-align: center; color: #94a3b8; }
    .empty-state .bi { font-size: 4rem; display: block; margin-bottom: 16px; }
</style>
<body>
<div th:replace="~{layout :: user_navbar}"></div>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- Header -->
            <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
                <div>
                    <span class="eyebrow-label">Inbox Updates</span>
                    <h1 class="section-title mb-1">My Notifications</h1>
                    <p class="text-muted small"
                       th:text="${unreadCount > 0} ? ${unreadCount} + ' unread notification(s)' : 'All caught up!'">
                    </p>
                </div>
                <form th:if="${!notifications.isEmpty()}" th:action="@{/user/notifications/read-all}" method="post" class="m-0">
                    <button type="submit" class="btn-outline-theme btn-sm py-2 px-3">
                        <i class="bi bi-check2-all"></i> Mark All Read
                    </button>
                </form>
            </div>

            <!-- Alert Flash -->
            <div th:if="${error}" class="alert alert-danger border-0 rounded-4 p-3 mb-4 small text-center" th:text="${error}"></div>

            <!-- Notifications List -->
            <div th:if="${notifications.isEmpty()}" class="card border-0">
                <div class="card-body empty-state">
                    <i class="bi bi-bell-slash text-muted mb-3 fs-1"></i>
                    <h5 class="fw-bold section-title mb-2">No notifications yet</h5>
                    <p class="text-muted small mb-4">You'll be notified here when there are flight updates.</p>
                    <a th:href="@{/user/bookings}" class="btn-primary-theme py-2 px-4">
                        <i class="bi bi-journal-check"></i> View My Bookings
                    </a>
                </div>
            </div>

            <div th:if="${!notifications.isEmpty()}" class="d-flex flex-column gap-3">
                <div th:each="n : ${notifications}"
                     th:classappend="${!n.read} ? 'unread' : ''"
                     class="card border-0 notif-card p-4">
                    <div class="d-flex align-items-start gap-3">
                        <!-- Icon -->
                        <div th:class="'notif-icon icon-' + ${n.type.name()}">
                            <span th:text="${n.type.name() == 'FLIGHT_DELAYED'} ? '⏰' :
                                           (n.type.name() == 'GATE_CHANGED' ? '🚪' :
                                           (n.type.name() == 'BOARDING_STARTED' ? '🛫' :
                                           (n.type.name() == 'FLIGHT_CANCELLED' ? '❌' : '🔔')))">🔔</span>
                        </div>

                        <!-- Content -->
                        <div class="flex-grow-1">
                            <div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
                                <span th:class="'notif-type-badge badge-' + ${n.type.name()}"
                                      th:text="${n.type.name() == 'FLIGHT_DELAYED'} ? 'Delayed' :
                                               (n.type.name() == 'GATE_CHANGED' ? 'Gate Change' :
                                               (n.type.name() == 'BOARDING_STARTED' ? 'Boarding' :
                                               (n.type.name() == 'FLIGHT_CANCELLED' ? 'Cancelled' : 'Departure Reminder')))">Type</span>
                                <span class="text-muted small" style="font-size: 0.75rem;"
                                      th:text="${#temporals.format(n.sentAt, 'dd MMM yyyy, HH:mm')}">date</span>
                                <span th:if="${!n.read}" class="badge bg-primary ms-auto small" style="font-size:.65rem; padding: 0.25em 0.5em;">NEW</span>
                            </div>
                            <p class="mb-2 text-dark dark:text-white fw-semibold small" th:text="${n.message}">Notification message.</p>
                            <small class="text-muted" style="font-size: 0.75rem;">
                                Flight: <strong class="text-dark dark:text-white" th:text="${n.booking.flight.flightNumber}">FL-101</strong>
                                · Booking: <strong class="text-dark dark:text-white" th:text="${'SKY-' + #strings.padLeft('' + n.booking.id, 5, '0')}">SKY-00001</strong>
                            </small>
                        </div>

                        <!-- Mark Read -->
                        <div th:if="${!n.read}">
                            <form th:action="@{/user/notifications/read/{id}(id=${n.id})}" method="post" class="m-0">
                                <button type="submit" class="btn btn-outline-secondary btn-sm rounded-pill p-2"
                                        title="Mark as read">
                                    <i class="bi bi-check2"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
