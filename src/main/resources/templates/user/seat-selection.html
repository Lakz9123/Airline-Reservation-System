<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Select Seats')}"></head>
<body>
<div th:replace="~{layout :: user_navbar}"></div>
<main class="container">
    <!-- Flight Header -->
    <div class="card border-0 mb-4">
        <div class="card-body p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-4">
                <div>
                    <span class="eyebrow-label">Flight Selection</span>
                    <h3 class="section-title mb-2">
                        <span class="badge bg-primary-subtle text-primary border px-2.5 py-1.5 me-2" th:text="${flight.flightNumber}">FL-101</span>
                        <span th:text="${flight.airline.airlineName}">Airline</span>
                    </h3>
                    <div class="text-muted small">
                        <i class="bi bi-geo-alt-fill text-primary"></i>
                        <strong th:text="${flight.originAirport.airportCode} + ' (' + ${flight.originAirport.city} + ')'">A</strong>
                        <i class="bi bi-arrow-right mx-2 text-primary"></i>
                        <strong th:text="${flight.destinationAirport.airportCode} + ' (' + ${flight.destinationAirport.city} + ')'">B</strong>
                        &nbsp;|&nbsp;
                        <i class="bi bi-calendar3 text-primary"></i>
                        <span th:text="${#temporals.format(flight.departureDateTime,'dd MMM yyyy HH:mm')}">Date</span>
                    </div>
                </div>
                <div class="text-md-end">
                    <div class="fs-4 fw-bold text-primary">From ₹<span th:text="${#numbers.formatDecimal(flight.economyFare ?: flight.fare, 1, 2)}">0</span></div>
                    <small class="text-muted"><span th:text="${flight.availableSeats}">0</span> seats available</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Banner -->
    <div th:if="${error}" class="alert alert-danger border-0 rounded-4 p-3 mb-4 small" th:text="${error}"></div>

    <!-- Legend -->
    <div class="card border-0 p-4 mb-4">
        <div class="d-flex gap-4 mb-0 flex-wrap justify-content-center align-items-center">
            <span class="d-flex align-items-center gap-2">
                <button class="seat-btn" disabled style="background-color:#d97706; border-color:#b45309; width:28px; height:28px; border-radius:8px; border:none;"></button>
                <span class="small fw-semibold text-muted">First Class</span>
            </span>
            <span class="d-flex align-items-center gap-2">
                <button class="seat-btn" disabled style="background-color:#9333ea; border-color:#7e22ce; width:28px; height:28px; border-radius:8px; border:none;"></button>
                <span class="small fw-semibold text-muted">Business</span>
            </span>
            <span class="d-flex align-items-center gap-2">
                <button class="seat-btn" disabled style="background-color:#0d9488; border-color:#0f766e; width:28px; height:28px; border-radius:8px; border:none;"></button>
                <span class="small fw-semibold text-muted">Premium Economy</span>
            </span>
            <span class="d-flex align-items-center gap-2">
                <button class="seat-btn" disabled style="background-color:#0284c7; border-color:#0369a1; width:28px; height:28px; border-radius:8px; border:none;"></button>
                <span class="small fw-semibold text-muted">Economy</span>
            </span>
            <span class="d-flex align-items-center gap-2">
                <button class="seat-btn" disabled style="background-color:#64748b; width:28px; height:28px; border-radius:8px; border:none; opacity:0.6;"></button>
                <span class="small fw-semibold text-muted">Booked</span>
            </span>
            <span class="d-flex align-items-center gap-2">
                <button class="seat-btn" disabled style="background-color:#22c55e; width:28px; height:28px; border-radius:8px; border:none;"></button>
                <span class="small fw-semibold text-muted">Selected</span>
            </span>
        </div>
    </div>

    <!-- Seat Map -->
    <form th:action="@{/user/book/{id}(id=${flight.id})}" method="post" id="seatForm">
        <div class="card border-0 p-4 p-md-5 mb-4">
            <div class="text-center text-muted mb-4 small text-uppercase tracking-wider font-monospace"><i class="bi bi-caret-up-fill me-1"></i> Front of Plane</div>
            <div id="seatMap" class="d-flex flex-column gap-3 align-items-center">
                <!-- Rendered by JS -->
            </div>
            <div class="text-center text-muted mt-4 small text-uppercase tracking-wider font-monospace"><i class="bi bi-caret-down-fill me-1"></i> Rear of Plane</div>
        </div>

        <!-- Booking Summary -->
        <div class="card border-0 p-4 p-md-5 mb-4">
            <h5 class="fw-bold section-title mb-4">Booking Summary</h5>

            <div class="row align-items-center g-4">
                <div class="col-md-6">
                    <label for="cabinClass" class="form-label fw-bold text-uppercase small text-muted">Cabin Class</label>
                    <select class="form-select" id="cabinClass" name="cabinClass" onchange="updateSummary()">
                        <option value="Economy">Economy</option>
                        <option value="Premium Economy">Premium Economy</option>
                        <option value="Business Class">Business Class</option>
                        <option value="First Class">First Class</option>
                    </select>
                </div>
                <div class="col-md-6 border-start-md px-md-4">
                    <p class="mb-2 text-muted small">Selected seats: <strong id="selectedSeatDisplay" class="text-primary fs-5">None</strong></p>
                    <p class="mb-0 text-muted small">Total fare: <strong id="totalFareDisplay" class="text-primary fs-4">₹0.00</strong></p>
                </div>
            </div>

            <div class="mt-4 pt-3 border-top d-flex justify-content-end">
                <button type="submit" class="btn-primary-theme py-3 px-5 text-uppercase" id="confirmBtn" disabled>
                    Proceed to Payment <i class="bi bi-arrow-right ms-2"></i>
                </button>
            </div>
        </div>
    </form>
</main>

<!-- Pass data from Thymeleaf → JS -->
<script th:inline="javascript">
    const allSeats    = /*[[${allSeats}]]*/ [];
    const bookedSeats = new Set(/*[[${bookedSeats}]]*/ []);
    const farePerSeat = /*[[${flight.fare}]]*/ 0;

    // Actual per-class fares from the flight entity
    const economyFare        = /*[[${flight.economyFare ?: flight.fare}]]*/ 0;
    const premiumEconomyFare = /*[[${flight.premiumEconomyFare ?: (flight.fare * 1.5)}]]*/ 0;
    const businessFare       = /*[[${flight.businessFare ?: (flight.fare * 2.5)}]]*/ 0;
    const firstClassFare     = /*[[${flight.firstClassFare ?: (flight.fare * 4.0)}]]*/ 0;

    // Four-section seat counts (derived server-side from aircraft config)
    const seatCounts = {
        firstClass:     /*[[${seatCounts.firstClass}]]*/ 0,
        business:       /*[[${seatCounts.business}]]*/ 0,
        premiumEconomy: /*[[${seatCounts.premiumEconomy}]]*/ 0,
        economy:        /*[[${seatCounts.economy}]]*/ 0
    };
</script>
<script>
    const seatMap             = document.getElementById('seatMap');
    const selectedSeatDisplay = document.getElementById('selectedSeatDisplay');
    const totalFareDisplay    = document.getElementById('totalFareDisplay');
    const confirmBtn          = document.getElementById('confirmBtn');
    const seatForm            = document.getElementById('seatForm');
    const cabinClassSelect    = document.getElementById('cabinClass');
    let selectedSeats = new Set();

    // Cabin zone boundaries (cumulative index into allSeats[])
    const zones = [
        { name: 'First Class',     count: seatCounts.firstClass,     color: '#d97706', border: '#b45309', cols: 4, aisle: 2, value: 'First Class'     },
        { name: 'Business Class',  count: seatCounts.business,       color: '#9333ea', border: '#7e22ce', cols: 4, aisle: 2, value: 'Business Class'   },
        { name: 'Premium Economy', count: seatCounts.premiumEconomy, color: '#0d9488', border: '#0f766e', cols: 5, aisle: 2, value: 'Premium Economy'  },
        { name: 'Economy',         count: seatCounts.economy,        color: '#0284c7', border: '#0369a1', cols: 6, aisle: 3, value: 'Economy'          }
    ];

    // Build a seat→zone lookup: { seatLabel -> zone }
    const seatZoneMap = {};
    let idx = 0;
    for (const zone of zones) {
        for (let i = 0; i < zone.count && idx < allSeats.length; i++, idx++) {
            seatZoneMap[allSeats[idx]] = zone;
        }
    }

    function renderSeats() {
        seatMap.innerHTML = '';
        let currentIndex = 0;

        for (const zone of zones) {
            if (zone.count <= 0) continue;

            // Section header
            const header = document.createElement('div');
            header.className = 'w-100 text-center fw-bold my-3 py-2 rounded-3 small text-uppercase tracking-wider';
            header.style.backgroundColor = zone.color + '15'; // subtle tint
            header.style.color = zone.color;
            header.style.borderLeft = `4px solid ${zone.color}`;
            header.textContent = `— ${zone.name} —`;
            seatMap.appendChild(header);

            let zoneCount = 0;
            while (zoneCount < zone.count && currentIndex < allSeats.length) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'd-flex gap-2 justify-content-center';

                for (let j = 0; j < zone.cols && zoneCount < zone.count && currentIndex < allSeats.length; j++, currentIndex++, zoneCount++) {
                    if (j === zone.aisle) {
                        const spacer = document.createElement('div');
                        spacer.style.width = '28px';
                        rowDiv.appendChild(spacer);
                    }
                    createSeatBtn(allSeats[currentIndex], rowDiv, zone);
                }
                seatMap.appendChild(rowDiv);
            }
        }
    }

    function createSeatBtn(seat, rowDiv, zone) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = seat;
        btn.style.width = '38px';
        btn.style.height = '38px';
        btn.style.fontSize = '9px';
        btn.style.borderRadius = '8px';
        btn.style.fontWeight = '700';
        btn.style.border = 'none';
        btn.style.transition = 'all 0.2s ease';
        btn.dataset.zone = zone.value;

        if (bookedSeats.has(seat)) {
            btn.style.backgroundColor = '#64748b';
            btn.style.color = '#fff';
            btn.style.opacity = '0.5';
            btn.style.cursor = 'not-allowed';
            btn.disabled = true;
        } else {
            btn.style.backgroundColor = zone.color;
            btn.style.color = '#fff';
            btn.style.cursor = 'pointer';
            btn.addEventListener('click', () => toggleSeat(seat, btn, zone));
        }
        rowDiv.appendChild(btn);
    }

    function toggleSeat(seat, btn, zone) {
        if (selectedSeats.has(seat)) {
            selectedSeats.delete(seat);
            btn.style.backgroundColor = zone.color;
            btn.style.transform = 'scale(1)';
        } else {
            selectedSeats.add(seat);
            btn.style.backgroundColor = '#22c55e'; // selected color matches legend
            btn.style.transform = 'scale(1.08)';
            cabinClassSelect.value = zone.value;
        }
        updateSummary();
    }

    function getFarePerSeat(cabinClass) {
        switch (cabinClass) {
            case 'First Class':     return firstClassFare     || (farePerSeat * 4.0);
            case 'Business Class':  return businessFare       || (farePerSeat * 2.5);
            case 'Premium Economy': return premiumEconomyFare || (farePerSeat * 1.5);
            default:                return economyFare        || farePerSeat;
        }
    }

    function updateSummary() {
        seatForm.querySelectorAll('input[name="selectedSeats"]').forEach(el => el.remove());
        if (selectedSeats.size === 0) {
            selectedSeatDisplay.textContent = 'None';
            totalFareDisplay.textContent = '₹0.00';
            confirmBtn.disabled = true;
        } else {
            const arr = [...selectedSeats];
            selectedSeatDisplay.textContent = arr.join(', ');

            const perSeat = getFarePerSeat(cabinClassSelect.value);
            const total = arr.length * perSeat;
            totalFareDisplay.textContent = '₹' + total.toFixed(2);
            confirmBtn.disabled = false;

            arr.forEach(s => {
                const inp = document.createElement('input');
                inp.type  = 'hidden';
                inp.name  = 'selectedSeats';
                inp.value = s;
                seatForm.appendChild(inp);
            });
        }
    }

    renderSeats();
</script>
<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
