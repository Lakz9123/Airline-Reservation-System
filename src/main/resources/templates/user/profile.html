<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('My Profile')}"></head>
<body>
<div th:replace="~{layout :: user_navbar}"></div>

<main class="container">
    <div class="row mb-4">
        <div class="col-12">
            <span class="eyebrow-label">Personal Settings</span>
            <h1 class="section-title mb-1">My Profile</h1>
            <p class="text-muted small">Update your name or secure your account credentials.</p>
        </div>
    </div>

    <div class="row g-4">
        <!-- Profile Info Card -->
        <div class="col-md-6">
            <div class="card border-0 h-100 p-3">
                <div class="card-body">
                    <span class="eyebrow-label mb-2">Details</span>
                    <h5 class="fw-bold section-title mb-4"><i class="bi bi-person-lines-fill text-primary me-1"></i>Account Information</h5>
                    
                    <div th:if="${nameSuccess}" class="alert alert-success border-0 rounded-4 p-3 mb-4 small" th:text="${nameSuccess}"></div>
                    <div th:if="${nameError}" class="alert alert-danger border-0 rounded-4 p-3 mb-4 small" th:text="${nameError}"></div>
                    
                    <div class="mb-4">
                        <span class="text-muted small d-block">Email Address</span>
                        <span class="fw-bold fs-5 text-dark dark:text-white" th:text="${currentUser.email}">email@example.com</span>
                    </div>

                    <div class="mb-4 d-flex align-items-center flex-wrap gap-2">
                        <span class="text-muted small">Loyalty Status:</span>
                        <span class="badge bg-secondary-subtle text-secondary border px-2.5 py-1.5 fw-bold" th:if="${wallet.tier.name() == 'SILVER'}">SILVER MEMBER</span>
                        <span class="badge bg-warning-subtle text-warning border px-2.5 py-1.5 fw-bold" th:if="${wallet.tier.name() == 'GOLD'}">GOLD MEMBER</span>
                        <span class="badge bg-dark-subtle text-dark border px-2.5 py-1.5 fw-bold" th:if="${wallet.tier.name() == 'PLATINUM'}">PLATINUM MEMBER</span>
                        <a th:href="@{/user/loyalty}" class="small ms-2 fw-semibold text-decoration-none">View Details <i class="bi bi-arrow-right"></i></a>
                    </div>

                    <form th:action="@{/user/profile/update-name}" method="post">
                        <div class="mb-4">
                            <label for="name" class="form-label fw-bold text-uppercase small text-muted">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" th:value="${currentUser.name}" required>
                        </div>
                        <button type="submit" class="btn-primary-theme w-100 py-3"><i class="bi bi-save me-1"></i> Update Name</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Change Password Card -->
        <div class="col-md-6">
            <div class="card border-0 h-100 p-3">
                <div class="card-body">
                    <span class="eyebrow-label mb-2">Security</span>
                    <h5 class="fw-bold section-title mb-4"><i class="bi bi-key-fill text-warning me-1"></i>Change Password</h5>
                    
                    <div th:if="${passwordSuccess}" class="alert alert-success border-0 rounded-4 p-3 mb-4 small" th:text="${passwordSuccess}"></div>
                    <div th:if="${passwordError}" class="alert alert-danger border-0 rounded-4 p-3 mb-4 small" th:text="${passwordError}"></div>
                    
                    <form th:action="@{/user/profile/change-password}" method="post">
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label fw-bold text-uppercase small text-muted">Current Password</label>
                            <input type="password" class="form-control" id="currentPassword" name="currentPassword" required>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label fw-bold text-uppercase small text-muted">New Password <span class="text-muted">(min 6 characters)</span></label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                        </div>
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-bold text-uppercase small text-muted">Confirm New Password</label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                        </div>
                        <button type="submit" class="btn-primary-theme w-100 py-3" style="background: linear-gradient(135deg, #f59e0b, #d97706) !important; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2);"><i class="bi bi-lock-fill me-1"></i> Change Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
