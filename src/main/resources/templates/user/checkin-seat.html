<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Online Check-in - Confirm Seats')}"></head>
<body>
<div th:replace="~{layout :: user_navbar}"></div>
<main class="container">
  <!-- Flight Header -->
  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
          <h3 class="fw-bold mb-1">
            <span class="badge bg-primary me-2" th:text="${flight.flightNumber}">FL-101</span>
            <span th:text="${flight.airline.airlineName}">Airline</span>
          </h3>
          <div class="text-muted">
            <i class="bi bi-geo-alt-fill"></i>
            <strong th:text="${flight.originAirport.airportCode} + ' (' + ${flight.originAirport.city} + ')'">A</strong>
            &rarr;
            <strong th:text="${flight.destinationAirport.airportCode} + ' (' + ${flight.destinationAirport.city} + ')'">B</strong>
            &nbsp;|&nbsp;
            <i class="bi bi-calendar3"></i>
            <span th:text="${#temporals.format(flight.departureDateTime,'dd MMM yyyy HH:mm')}">Date</span>
          </div>
        </div>
        <div class="text-end">
          <div class="fs-5 fw-bold text-success">Check-In Open</div>
          <small class="text-muted"><span th:text="${flight.availableSeats}">0</span> seats available to switch</small>
        </div>
      </div>
    </div>
  </div>

  <!-- Error -->
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" th:text="${error}">
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- Legend -->
  <div class="d-flex gap-3 mb-3 flex-wrap justify-content-center align-items-center">
    <span class="d-flex align-items-center gap-1">
      <button class="seat-btn" disabled style="background-color:#9C1B2E;border-color:#7a1525;color:#fff;width:32px;height:32px;font-size:10px;border-radius:6px;border:2px solid;"></button>
      <span class="small fw-semibold">First Class</span>
    </span>
    <span class="d-flex align-items-center gap-1">
      <button class="seat-btn" disabled style="background-color:#B8860B;border-color:#8b6508;color:#fff;width:32px;height:32px;font-size:10px;border-radius:6px;border:2px solid;"></button>
      <span class="small fw-semibold">Business</span>
    </span>
    <span class="d-flex align-items-center gap-1">
      <button class="seat-btn" disabled style="background-color:#1565C0;border-color:#0d4a94;color:#fff;width:32px;height:32px;font-size:10px;border-radius:6px;border:2px solid;"></button>
      <span class="small fw-semibold">Premium Economy</span>
    </span>
    <span class="d-flex align-items-center gap-1">
      <button class="seat-btn" disabled style="background-color:#546E7A;border-color:#37474f;color:#fff;width:32px;height:32px;font-size:10px;border-radius:6px;border:2px solid;"></button>
      <span class="small fw-semibold">Economy</span>
    </span>
    <span class="d-flex align-items-center gap-1">
      <button class="seat-btn seat-booked" disabled style="width:32px;height:32px;font-size:10px;border-radius:6px;"></button>
      <span class="small fw-semibold">Booked</span>
    </span>
    <span class="d-flex align-items-center gap-1">
      <button class="seat-btn seat-selected" disabled style="width:32px;height:32px;font-size:10px;border-radius:6px;"></button>
      <span class="small fw-semibold">Selected</span>
    </span>
  </div>

  <!-- Seat Map -->
  <form th:action="@{/user/checkin/{id}/confirm(id=${booking.id})}" method="post" id="seatForm">
    <div class="card border-0 shadow-sm p-4 mb-4">
      <div class="text-center text-muted mb-3"><small>✈️ Front of Plane</small></div>
      <div id="seatMap" class="d-flex flex-column gap-2 align-items-center">
        <!-- Rendered by JS using Thymeleaf data -->
      </div>
      <div class="text-center text-muted mt-3"><small>🛄 Rear of Plane</small></div>
    </div>

    <div class="card border-0 shadow-sm p-3 p-md-4 mb-4 text-center">
      <h5 class="fw-bold mb-3">Confirm Your Seats</h5>
      <p class="mb-3 text-muted">You are currently assigned: <strong class="text-dark" th:text="${booking.seatNumbers}"></strong>. You can keep these or select different available seats.</p>

      <p class="mb-3">Selected seats: <strong id="selectedSeatDisplay" class="fs-5 text-primary">None</strong></p>
      <button type="submit" class="btn btn-success btn-lg px-5" id="confirmBtn" disabled>
        <i class="bi bi-check2-circle"></i> Confirm Check-In
      </button>
    </div>
  </form>
</main>

<!-- Pass data from Thymeleaf → JS -->
<script th:inline="javascript">
  const allSeats       = /*[[${allSeats}]]*/ [];
  const bookedSeats    = new Set(/*[[${bookedSeats}]]*/ []);
  const currentSeatsArr = /*[[${currentSeats}]]*/ [];
  const targetSeatCount = currentSeatsArr.length;

  // Four-section seat counts (derived server-side from aircraft config)
  const seatCounts = {
    firstClass:     /*[[${seatCounts.firstClass}]]*/ 0,
    business:       /*[[${seatCounts.business}]]*/ 0,
    premiumEconomy: /*[[${seatCounts.premiumEconomy}]]*/ 0,
    economy:        /*[[${seatCounts.economy}]]*/ 0
  };
</script>
<script>
  const seatMap             = document.getElementById('seatMap');
  const selectedSeatDisplay = document.getElementById('selectedSeatDisplay');
  const confirmBtn          = document.getElementById('confirmBtn');
  const seatForm            = document.getElementById('seatForm');
  let selectedSeats = new Set(currentSeatsArr);

  // Cabin zones — same definition as seat-selection.html
  const zones = [
    { name: 'First Class',     count: seatCounts.firstClass,     color: '#9C1B2E', border: '#7a1525', cols: 4, aisle: 2 },
    { name: 'Business Class',  count: seatCounts.business,       color: '#B8860B', border: '#8b6508', cols: 4, aisle: 2 },
    { name: 'Premium Economy', count: seatCounts.premiumEconomy, color: '#1565C0', border: '#0d4a94', cols: 5, aisle: 2 },
    { name: 'Economy',         count: seatCounts.economy,        color: '#546E7A', border: '#37474f', cols: 6, aisle: 3 }
  ];

  // Build a seat→zone lookup
  const seatZoneMap = {};
  let idx = 0;
  for (const zone of zones) {
    for (let i = 0; i < zone.count && idx < allSeats.length; i++, idx++) {
      seatZoneMap[allSeats[idx]] = zone;
    }
  }

  function renderSeats() {
    seatMap.innerHTML = '';
    let currentIndex = 0;

    for (const zone of zones) {
      if (zone.count <= 0) continue;

      const header = document.createElement('div');
      header.className = 'w-100 text-center fw-bold my-2 py-1 rounded';
      header.style.backgroundColor = zone.color + '22';
      header.style.color = zone.color;
      header.style.borderLeft = `4px solid ${zone.color}`;
      header.textContent = `— ${zone.name} —`;
      seatMap.appendChild(header);

      let zoneCount = 0;
      while (zoneCount < zone.count && currentIndex < allSeats.length) {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'd-flex gap-2 justify-content-center';

        for (let j = 0; j < zone.cols && zoneCount < zone.count && currentIndex < allSeats.length; j++, currentIndex++, zoneCount++) {
          if (j === zone.aisle) {
            const spacer = document.createElement('div');
            spacer.style.width = '24px';
            rowDiv.appendChild(spacer);
          }
          createSeatBtn(allSeats[currentIndex], rowDiv, zone);
        }
        seatMap.appendChild(rowDiv);
      }
    }
  }

  function createSeatBtn(seat, rowDiv, zone) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = seat;
    btn.className = 'seat-btn';
    btn.style.width = '42px';
    btn.style.height = '42px';
    btn.style.fontSize = '10px';
    btn.style.borderRadius = '6px';
    btn.style.fontWeight = '600';

    if (bookedSeats.has(seat)) {
      btn.classList.add('seat-booked');
      btn.disabled = true;
    } else if (selectedSeats.has(seat)) {
      // Pre-select current seats
      btn.classList.add('seat-selected');
      btn.addEventListener('click', () => toggleSeat(seat, btn, zone));
    } else {
      btn.style.backgroundColor = zone.color;
      btn.style.borderColor = zone.border;
      btn.style.color = '#fff';
      btn.classList.add('seat-available');
      btn.addEventListener('click', () => toggleSeat(seat, btn, zone));
    }
    rowDiv.appendChild(btn);
  }

  function toggleSeat(seat, btn, zone) {
    if (selectedSeats.has(seat)) {
      selectedSeats.delete(seat);
      btn.classList.remove('seat-selected');
      btn.classList.add('seat-available');
      btn.style.backgroundColor = zone.color;
      btn.style.borderColor = zone.border;
      btn.style.color = '#fff';
    } else {
      selectedSeats.add(seat);
      btn.classList.remove('seat-available');
      btn.classList.add('seat-selected');
      btn.style.backgroundColor = '';
      btn.style.borderColor = '';
      btn.style.color = '';
    }
    updateSummary();
  }

  function updateSummary() {
    seatForm.querySelectorAll('input[name="selectedSeats"]').forEach(el => el.remove());
    if (selectedSeats.size === 0) {
      selectedSeatDisplay.textContent = 'None';
      confirmBtn.disabled = true;
    } else {
      const arr = [...selectedSeats];
      selectedSeatDisplay.textContent = arr.join(', ');
      confirmBtn.disabled = (arr.length !== targetSeatCount);

      arr.forEach(s => {
        const inp = document.createElement('input');
        inp.type  = 'hidden';
        inp.name  = 'selectedSeats';
        inp.value = s;
        seatForm.appendChild(inp);
      });
    }
  }

  renderSeats();
  updateSummary(); // populate hidden fields for pre-selected seats on load
</script>
<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
