<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Ready to Fly')}"></head>
<body>
<div th:replace="~{layout :: user_navbar}"></div>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 mb-4 overflow-hidden">
                <div class="bg-success text-white text-center py-5 px-4" style="background: linear-gradient(135deg, #22c55e, #16a34a) !important;">
                    <i class="bi bi-check-circle-fill display-3 mb-3 d-block"></i>
                    <h2 class="mt-2 mb-1 fw-bold">You're Checked In!</h2>
                    <p class="mb-0 text-white-50 small">Ready to fly with <span th:text="${booking.flight.airline.airlineName}">Airline</span></p>
                </div>
                
                <div class="card-body p-4 p-md-5">
                    <span class="eyebrow-label text-center mb-2">Pre-Departure Summary</span>
                    <h4 class="fw-bold mb-4 text-center section-title">Flight Summary</h4>
                    
                    <div class="row mb-4 g-3 text-center">
                        <div class="col-6 border-end" style="border-color: var(--border) !important;">
                            <div class="text-muted small text-uppercase tracking-wider">Flight</div>
                            <div class="fs-5 fw-bold text-dark dark:text-white mt-1">
                                <span th:text="${booking.flight.flightNumber}">FL-101</span>
                                <span th:with="s=${booking.flight.flightStatus ?: T(com.airline.reservation.entity.FlightStatus).SCHEDULED}"
                                      th:class="|badge ms-1 align-middle ${s.badgeClass}|"
                                      th:text="${s.label}">SCHEDULED</span>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="text-muted small text-uppercase tracking-wider">Departure Date</div>
                            <div class="fs-5 fw-bold text-dark dark:text-white mt-1" th:text="${#temporals.format(booking.flight.departureDateTime, 'dd MMM yyyy')}">Date</div>
                        </div>
                    </div>
                    
                    <div class="card bg-light border-0 p-4 mb-4">
                        <div class="row text-center align-items-center">
                            <div class="col-4">
                                <div class="fs-3 fw-bold text-primary" th:text="${booking.flight.originAirport.airportCode}">DEL</div>
                                <div class="text-muted small font-monospace" th:text="${#temporals.format(booking.flight.departureDateTime, 'HH:mm')}">08:00</div>
                            </div>
                            <div class="col-4 position-relative">
                                <div style="border-top: 2px dashed rgba(14, 165, 233, 0.2); position: relative;">
                                    <i class="bi bi-airplane-fill text-primary" style="position: absolute; top: -12px; left: 50%; transform: translateX(-50%) rotate(90deg); font-size: 0.9rem;"></i>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="fs-3 fw-bold text-primary" th:text="${booking.flight.destinationAirport.airportCode}">BOM</div>
                                <div class="text-muted small font-monospace" th:text="${#temporals.format(booking.flight.arrivalDateTime, 'HH:mm')}">10:30</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-6">
                            <div class="card bg-light border-0 p-3 text-center h-100">
                                <div class="text-muted small">Seat(s)</div>
                                <div class="fs-5 fw-bold text-primary mt-1" th:text="${booking.seatNumbers}">12A</div>
                                <div class="small text-muted" th:text="${booking.cabinClass}">Economy</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="card bg-light border-0 p-3 text-center h-100">
                                <div class="text-muted small">Boarding Time</div>
                                <div class="fs-5 fw-bold text-danger mt-1" th:text="${booking.flight.boardingTime != null ? #temporals.format(booking.flight.boardingTime, 'HH:mm') : 'TBA'}">07:15</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="card bg-light border-0 p-3 text-center h-100">
                                <div class="text-muted small">Gate</div>
                                <div class="fs-5 fw-bold text-dark dark:text-white mt-1" th:text="${booking.flight.gateNumber != null ? booking.flight.gateNumber : 'TBA'}">G12</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="card bg-light border-0 p-3 text-center h-100">
                                <div class="text-muted small">Terminal</div>
                                <div class="fs-5 fw-bold text-dark dark:text-white mt-1" th:text="${booking.flight.terminal != null ? booking.flight.terminal : 'TBA'}">T2</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-3 mt-4">
                        <a th:href="@{/user/boarding-pass/{id}(id=${booking.id})}" class="btn-primary-theme py-3 text-uppercase">
                            <i class="bi bi-file-earmark-check"></i> View Boarding Pass
                        </a>
                        <a th:href="@{/user/bookings}" class="btn-outline-theme py-2.5">
                            Back to My Bookings
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
