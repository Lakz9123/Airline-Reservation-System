<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Ready to Fly')}"></head>
<body style="background: #f8fafc;">
<div th:replace="~{layout :: user_navbar}"></div>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      
      <div class="card border-0 shadow-lg" style="border-radius: 1rem; overflow: hidden;">
        <div class="bg-success text-white text-center py-4">
          <i class="bi bi-check-circle-fill display-1"></i>
          <h2 class="mt-3 mb-0">You're Checked In!</h2>
          <p class="mb-0 text-white-50">Ready to fly with <span th:text="${booking.flight.airline.airlineName}">Airline</span></p>
        </div>
        
        <div class="card-body p-4 p-md-5">
          <h4 class="fw-bold mb-4 text-center">Flight Summary</h4>
          
          <div class="row mb-4">
            <div class="col-6 text-center border-end">
              <div class="text-muted small text-uppercase tracking-wider">Flight</div>
              <div class="fs-4 fw-bold" th:text="${booking.flight.flightNumber}">FL-101</div>
            </div>
            <div class="col-6 text-center">
              <div class="text-muted small text-uppercase tracking-wider">Date</div>
              <div class="fs-5 fw-bold mt-1" th:text="${#temporals.format(booking.flight.departureDateTime, 'dd MMM yyyy')}">Date</div>
            </div>
          </div>
          
          <div class="bg-light rounded p-3 mb-4">
            <div class="row text-center">
              <div class="col-4">
                <div class="fs-3 fw-bold" th:text="${booking.flight.originAirport.airportCode}">DEL</div>
                <div class="text-muted small" th:text="${#temporals.format(booking.flight.departureDateTime, 'HH:mm')}">08:00</div>
              </div>
              <div class="col-4 d-flex align-items-center justify-content-center">
                <i class="bi bi-airplane-fill text-primary fs-4"></i>
              </div>
              <div class="col-4">
                <div class="fs-3 fw-bold" th:text="${booking.flight.destinationAirport.airportCode}">BOM</div>
                <div class="text-muted small" th:text="${#temporals.format(booking.flight.arrivalDateTime, 'HH:mm')}">10:30</div>
              </div>
            </div>
          </div>
          
          <div class="row g-3 mb-4">
            <div class="col-6">
              <div class="border rounded p-3 text-center h-100">
                <div class="text-muted small">Seat(s)</div>
                <div class="fs-5 fw-bold text-primary" th:text="${booking.seatNumbers}">12A</div>
                <div class="small text-muted" th:text="${booking.cabinClass}">Economy</div>
              </div>
            </div>
            <div class="col-6">
              <div class="border rounded p-3 text-center h-100">
                <div class="text-muted small">Boarding Time</div>
                <div class="fs-5 fw-bold text-danger" th:text="${booking.flight.boardingTime != null ? #temporals.format(booking.flight.boardingTime, 'HH:mm') : 'TBA'}">07:15</div>
              </div>
            </div>
            <div class="col-6">
              <div class="border rounded p-3 text-center h-100">
                <div class="text-muted small">Gate</div>
                <div class="fs-5 fw-bold" th:text="${booking.flight.gateNumber != null ? booking.flight.gateNumber : 'TBA'}">G12</div>
              </div>
            </div>
            <div class="col-6">
              <div class="border rounded p-3 text-center h-100">
                <div class="text-muted small">Terminal</div>
                <div class="fs-5 fw-bold" th:text="${booking.flight.terminal != null ? booking.flight.terminal : 'TBA'}">T2</div>
              </div>
            </div>
          </div>
          
          <div class="d-grid gap-2 mt-4">
            <a th:href="@{/user/boarding-pass/{id}(id=${booking.id})}" class="btn btn-success btn-lg py-3">
              <i class="bi bi-file-earmark-check"></i> View Boarding Pass
            </a>
            <a th:href="@{/user/bookings}" class="btn btn-outline-secondary py-2 mt-2">
              Back to My Bookings
            </a>
          </div>
          
        </div>
      </div>
      
    </div>
  </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
