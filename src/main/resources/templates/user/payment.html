<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Payment Details')}"></head>
<body>
<div th:replace="~{layout :: user_navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-credit-card"></i> Payment Details</h5>
                </div>
                <div class="card-body p-4">
                    <!-- Flight & Fare Summary -->
                    <div class="bg-light p-3 rounded mb-4">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Flight:</span>
                            <span class="fw-bold" th:text="${flight.flightNumber} + ' (' + ${flight.originAirport.airportCode} + ' to ' + ${flight.destinationAirport.airportCode} + ')'">FL-101 (MAA to DEL)</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Seats:</span>
                            <span class="fw-bold" th:text="${#strings.listJoin(selectedSeats, ', ')}">A1, A2</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Cabin Class:</span>
                            <span class="fw-bold text-primary" th:text="${cabinClass}">Economy</span>
                        </div>
                        <hr>
                        <!-- Fare Breakdown -->
                        <div class="d-flex justify-content-between mb-1" th:if="${discountAmount > 0}">
                            <span class="text-muted">Original Fare:</span>
                            <span>₹<span th:text="${#numbers.formatDecimal(originalFare, 1, 2)}">0.00</span></span>
                        </div>
                        <div class="d-flex justify-content-between mb-2" th:if="${discountAmount > 0}">
                            <span class="text-muted">Discount Applied:</span>
                            <span class="text-success">-₹<span th:text="${#numbers.formatDecimal(discountAmount, 1, 2)}">0.00</span></span>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <span class="text-muted fs-5">Final Fare:</span>
                            <span class="fw-bold text-success fs-5">
                                ₹<span th:text="${#numbers.formatDecimal(totalFare, 1, 2)}">0.00</span>
                            </span>
                        </div>
                    </div>

                    <!-- Coupon Application Form -->
                    <div th:if="${appliedCouponDiscount == null || appliedCouponDiscount == 0.0}">
                        <div th:if="${couponError}" class="alert alert-danger p-2 small mb-3">
                            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${couponError}"></span>
                        </div>
                        <form th:action="@{/user/payment/{id}/apply-coupon(id=${flight.id})}" method="post" class="mb-4">
                            <th:block th:each="seat : ${selectedSeats}">
                                <input type="hidden" name="selectedSeats" th:value="${seat}">
                            </th:block>
                            <input type="hidden" name="cabinClass" th:value="${cabinClass}">
                            <input type="hidden" name="originalFare" th:value="${originalFare}">
                            
                            <label class="form-label text-muted small fw-bold">APPLY COUPON CODE</label>
                            <div class="input-group">
                                <input type="text" name="couponCode" class="form-control text-uppercase" placeholder="Enter promo code" required>
                                <button class="btn btn-outline-primary" type="submit">Apply</button>
                            </div>
                        </form>
                    </div>

                    <!-- Coupon Success Message -->
                    <div th:if="${couponSuccess}" class="alert alert-success p-2 small mb-4">
                        <i class="bi bi-check-circle-fill"></i> <span th:text="${couponSuccess}"></span>
                        <div class="mt-1 fw-bold">Code Applied: <span th:text="${appliedCouponCode}"></span></div>
                    </div>

                    <!-- Mock Payment Form -->
                    <form th:action="@{/user/payment/{id}(id=${flight.id})}" method="post">
                        <!-- Hidden inputs for seats -->
                        <th:block th:each="seat : ${selectedSeats}">
                            <input type="hidden" name="selectedSeats" th:value="${seat}">
                        </th:block>
                        <input type="hidden" name="cabinClass" th:value="${cabinClass}">
                        <input type="hidden" name="appliedCouponCode" th:value="${appliedCouponCode}">

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">CARD NUMBER</label>
                            <input type="text" class="form-control" placeholder="0000 0000 0000 0000" required>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-6">
                                <label class="form-label text-muted small fw-bold">EXPIRY DATE</label>
                                <input type="text" class="form-control" placeholder="MM/YY" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted small fw-bold">CVV</label>
                                <input type="password" class="form-control" placeholder="123" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">CARDHOLDER NAME</label>
                            <input type="text" class="form-control" placeholder="John Doe" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Pay ₹<span th:text="${#numbers.formatDecimal(totalFare, 1, 2)}">0.00</span> & Confirm
                            </button>
                            <a th:href="@{/user/book/{id}(id=${flight.id})}" class="btn btn-outline-secondary">
                                Cancel & Back to Seats
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
