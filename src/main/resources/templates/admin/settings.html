<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/admin-layout :: admin_head('Settings')}"></head>
<body class="bg-background text-on-background flex h-screen overflow-hidden antialiased">
    
    <nav th:replace="~{admin/admin-layout :: admin_sidebar(activePage=${activePage})}"></nav>

    <div class="flex-1 ml-64 flex flex-col min-w-0 bg-surface-bright">
        <header th:replace="~{admin/admin-layout :: admin_topbar}"></header>

        <main class="flex-1 overflow-y-auto p-gutter lg:p-margin-desktop">
            <div class="max-w-[800px] mx-auto space-y-6">
                
                <div class="flex flex-col mb-8">
                    <h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-2">
                        Settings
                    </h2>
                    <p class="font-body-md text-body-md text-on-surface-variant mt-1">Manage system preferences and appearance</p>
                </div>

                <div class="bg-surface rounded-xl border border-outline-variant shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-outline-variant/30 bg-surface-container-low">
                        <h3 class="font-headline-md text-lg text-on-surface flex items-center gap-2">
                            <span class="material-symbols-outlined text-secondary">tune</span>
                            General Preferences
                        </h3>
                    </div>
                    <div class="p-6 space-y-6">
                        
                        <div class="flex items-center justify-between">
                            <div>
                                <h4 class="font-body-md font-semibold text-on-surface">Enable Email Notifications</h4>
                                <p class="text-sm text-on-surface-variant mt-1">Receive alerts for new bookings and system errors.</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" value="" class="sr-only peer" checked>
                                <div class="w-11 h-6 bg-outline-variant rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-secondary"></div>
                            </label>
                        </div>
                        
                        <hr class="border-outline-variant/30">

                        <div class="flex items-center justify-between">
                            <div>
                                <h4 class="font-body-md font-semibold text-on-surface">Maintenance Mode</h4>
                                <p class="text-sm text-on-surface-variant mt-1">Temporarily disable booking features for customers.</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" value="" class="sr-only peer">
                                <div class="w-11 h-6 bg-outline-variant rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-error"></div>
                            </label>
                        </div>

                    </div>
                    <div class="p-4 bg-surface-container-low border-t border-outline-variant/30 flex justify-end">
                        <button class="bg-secondary text-on-secondary px-6 py-2 rounded-lg font-label-sm tracking-wide hover:bg-secondary-container transition-colors">
                            Save Changes
                        </button>
                    </div>
                </div>

            </div>
            <div class="-mx-4 -mb-4 md:-mx-6 md:-mb-6 lg:-mx-8 lg:-mb-8 mt-12">
        <footer th:replace="~{layout :: footer}"></footer>
    </div>
</main>
    </div>
</body>
</html>
