<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('User Wallet Transactions')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Transactions for <span class="text-primary" th:text="${wallet.user.name}"></span></h2>
        <a th:href="@{/admin/wallets}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to Wallets</a>
    </div>

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <h5>Current Balance</h5>
                    <h3>₹<span th:text="${#numbers.formatDecimal(wallet.balance, 1, 2)}"></span></h3>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card bg-warning text-dark">
                <div class="card-body">
                    <h5>Reward Points</h5>
                    <h3><i class="bi bi-star-fill"></i> <span th:text="${wallet.rewardPoints}"></span></h3>
                </div>
            </div>
        </div>
    </div>
    
    <div class="card shadow">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-3">Date</th>
                        <th>Type</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th class="text-end pe-3">Amount</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(transactions)}">
                        <td colspan="5" class="text-center py-4 text-muted">No transactions found for this user.</td>
                    </tr>
                    <tr th:each="tx : ${transactions}">
                        <td class="ps-3" th:text="${#temporals.format(tx.createdAt, 'dd MMM yyyy HH:mm:ss')}"></td>
                        <td>
                            <span class="badge" th:classappend="${tx.type.name() == 'CREDIT' ? 'bg-success' : 'bg-danger'}" th:text="${tx.type}"></span>
                        </td>
                        <td><span class="badge bg-secondary" th:text="${tx.category}"></span></td>
                        <td th:text="${tx.description}"></td>
                        <td class="text-end pe-3 fw-bold" th:classappend="${tx.type.name() == 'CREDIT' ? 'text-success' : 'text-danger'}">
                            <span th:text="${tx.type.name() == 'CREDIT' ? '+' : '-'}"></span>₹<span th:text="${#numbers.formatDecimal(tx.amount, 1, 2)}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
