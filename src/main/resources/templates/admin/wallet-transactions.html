<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/admin-layout :: admin_head('Wallet Transactions')}"></head>
<body class="bg-background text-on-background flex h-screen overflow-hidden antialiased">
    
    <nav th:replace="~{admin/admin-layout :: admin_sidebar(activePage='wallets')}"></nav>

    <div class="flex-1 ml-64 flex flex-col min-w-0 bg-surface-bright">
        <header th:replace="~{admin/admin-layout :: admin_topbar}"></header>

        <main class="flex-1 overflow-y-auto p-gutter lg:p-margin-desktop flex flex-col">
            <div class="max-w-[1000px] mx-auto space-y-6">
                
                <div class="flex items-center justify-between">
                    <div>
                        <a th:href="@{/admin/wallets}" class="text-secondary hover:underline text-sm font-medium mb-2 inline-flex items-center gap-1">
                            <span class="material-symbols-outlined text-[16px]">arrow_back</span> Back to Wallets
                        </a>
                        <h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-2">
                            Wallet Transactions
                        </h2>
                        <p class="font-body-md text-body-md text-on-surface-variant mt-1" th:text="'History for ' + ${wallet.user.name}">History for John Doe</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-surface rounded-xl border border-outline-variant shadow-sm p-6 flex flex-col relative overflow-hidden">
                        <div class="absolute right-0 top-0 w-24 h-24 bg-secondary-fixed/30 rounded-bl-full -mr-4 -mt-4"></div>
                        <h3 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2 relative z-10">Current Balance</h3>
                        <div class="font-display-lg text-4xl text-on-surface relative z-10" th:text="'₹' + ${#numbers.formatDecimal(wallet.balance, 1, 'COMMA', 2, 'POINT')}">₹450.00</div>
                    </div>
                    <div class="bg-surface rounded-xl border border-outline-variant shadow-sm p-6 flex flex-col relative overflow-hidden">
                        <div class="absolute right-0 top-0 w-24 h-24 bg-amber-100/50 rounded-bl-full -mr-4 -mt-4"></div>
                        <h3 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2 relative z-10 flex items-center gap-1">
                            <span class="material-symbols-outlined text-[16px] text-amber-500">stars</span> Reward Points
                        </h3>
                        <div class="font-display-lg text-4xl text-on-surface relative z-10" th:text="${#numbers.formatInteger(wallet.rewardPoints, 1, 'COMMA')}">4,200</div>
                    </div>
                </div>

                <!-- Transactions Table -->
                <div class="bg-surface rounded-xl border border-outline-variant shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[800px]">
                            <thead>
                                <tr class="bg-surface-container-low border-b border-outline-variant">
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold">Date & Time</th>
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold">Type</th>
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold">Category</th>
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold">Description</th>
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold text-right">Amount</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-outline-variant/50 font-body-md text-body-md text-on-surface">
                                <tr th:each="tx : ${transactions}" class="hover:bg-surface-variant/10 transition-colors">
                                    <td class="py-4 px-6 text-on-surface-variant text-sm font-medium">
                                        <span th:text="${#temporals.format(tx.createdAt, 'MMM dd, yyyy')}">Oct 24, 2026</span>
                                        <br>
                                        <span class="text-xs opacity-70" th:text="${#temporals.format(tx.createdAt, 'HH:mm')}">14:30</span>
                                    </td>
                                    <td class="py-4 px-6">
                                        <span th:if="${tx.type.name() == 'CREDIT'}" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-green-50 text-green-700">Credit</span>
                                        <span th:if="${tx.type.name() == 'DEBIT'}" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-red-50 text-red-700">Debit</span>
                                    </td>
                                    <td class="py-4 px-6">
                                        <span class="inline-block bg-surface-container-high px-2 py-0.5 rounded text-xs font-medium text-on-surface-variant uppercase tracking-wider" th:text="${tx.category}">FLIGHT_BOOKING</span>
                                    </td>
                                    <td class="py-4 px-6 text-on-surface">
                                        <span th:text="${tx.description}">Booking #101 Payment</span>
                                    </td>
                                    <td class="py-4 px-6 text-right font-semibold" th:classappend="${tx.type.name() == 'CREDIT' ? 'text-green-600' : 'text-on-surface'}">
                                        <span th:text="${tx.type.name() == 'CREDIT' ? '+' : '-'}">-</span>$<span th:text="${#numbers.formatDecimal(tx.amount, 1, 'COMMA', 2, 'POINT')}">150.00</span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(transactions)}">
                                    <td colspan="5" class="py-8 text-center text-on-surface-variant">No transactions found for this wallet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
            <div class="-mx-gutter -mb-gutter lg:-mx-margin-desktop lg:-mb-margin-desktop mt-12">
        <footer th:replace="~{layout :: footer}"></footer>
    </div>
</main>
    </div>
</body>
</html>
