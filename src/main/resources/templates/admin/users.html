<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('User Management')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark"><i class="bi bi-people-fill text-success"></i> User Management Directory</h2>
    </div>

    <!-- Feedback alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}">Success message.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">Error message.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Users Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th class="text-center">Account Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="6" class="text-center py-4 text-muted">No users registered yet.</td>
                        </tr>
                        <tr th:each="user : ${users}">
                            <td>#<span th:text="${user.id}">1</span></td>
                            <td><strong th:text="${user.name}">User Name</strong></td>
                            <td th:text="${user.email}">email@example.com</td>
                            <td>
                                <span class="badge bg-danger" th:if="${user.role == 'ROLE_ADMIN'}">ADMIN</span>
                                <span class="badge bg-primary" th:if="${user.role == 'ROLE_USER'}">USER</span>
                            </td>
                            <td>
                                <span class="badge bg-success" th:if="${user.enabled}">ENABLED</span>
                                <span class="badge bg-secondary" th:if="${!user.enabled}">DISABLED</span>
                            </td>
                            <td class="text-center">
                                <form th:action="@{/admin/users/toggle/{id}(id=${user.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm" 
                                            th:classappend="${user.enabled ? 'btn-outline-warning' : 'btn-outline-success'}">
                                        <i class="bi" th:classappend="${user.enabled ? 'bi-person-slash' : 'bi-person-check'}"></i>
                                        <span th:text="${user.enabled ? 'Disable' : 'Enable'}">Toggle</span>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
