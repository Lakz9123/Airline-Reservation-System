<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/admin-layout :: admin_head('User Administration')}"></head>
<body class="bg-background text-on-background flex h-screen overflow-hidden antialiased">
    
    <nav th:replace="~{admin/admin-layout :: admin_sidebar(activePage='users')}"></nav>

    <div class="flex-1 ml-64 flex flex-col min-w-0 bg-surface-bright">
        
        <header th:replace="~{admin/admin-layout :: admin_topbar}"></header>

        <main class="flex-1 overflow-y-auto p-gutter lg:p-margin-desktop">
            <div class="max-w-container-max mx-auto space-y-6">
                
                <div th:if="${success}" class="bg-green-50 text-green-700 border border-green-200 rounded-lg p-4 mb-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined">check_circle</span>
                        <span th:text="${success}">Success</span>
                    </div>
                </div>
                
                <div th:if="${error}" class="bg-red-50 text-red-700 border border-red-200 rounded-lg p-4 mb-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined">error</span>
                        <span th:text="${error}">Error</span>
                    </div>
                </div>

                <!-- Page Header -->
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
                    <div>
                        <h2 class="font-headline-md text-headline-md text-on-surface">User Administration</h2>
                        <p class="font-body-md text-body-md text-on-surface-variant mt-1">Manage all registered customers and staff members.</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
                            <input class="w-64 bg-surface-container-low border border-outline-variant rounded-lg py-2 pl-9 pr-4 font-label-sm text-label-sm text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" placeholder="Search by name, email..." type="text">
                        </div>
                        <button class="flex items-center gap-2 px-4 py-2 border border-outline-variant rounded-lg text-on-surface font-label-sm text-label-sm hover:bg-surface-variant/50 transition-colors">
                            <span class="material-symbols-outlined text-[18px]">filter_list</span>
                            Filter
                        </button>
                        <button class="flex items-center gap-2 px-4 py-2 bg-secondary text-on-secondary rounded-lg font-label-sm text-label-sm hover:bg-secondary-container transition-colors shadow-sm">
                            <span class="material-symbols-outlined text-[18px]">person_add</span>
                            Add User
                        </button>
                    </div>
                </div>

                <!-- Table Card -->
                <div class="bg-surface rounded-xl border border-outline-variant shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[900px]">
                            <thead>
                                <tr class="bg-surface-container-low border-b border-outline-variant">
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold w-16">ID</th>
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold">User</th>
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold">Email</th>
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold">Role</th>
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold text-center">Status</th>
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold text-right w-24">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-outline-variant/50 font-body-md text-body-md text-on-surface">
                                <tr th:each="user : ${users}" class="hover:bg-surface-variant/10 transition-colors group">
                                    <td class="py-4 px-6 text-on-surface-variant text-sm font-medium" th:text="'#' + ${user.id}">#1</td>
                                    <td class="py-4 px-6 flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center text-secondary font-bold text-sm shrink-0" th:text="${#strings.substring(user.name, 0, 1)}">U</div>
                                        <span class="font-medium text-on-surface" th:text="${user.name}">John Doe</span>
                                    </td>
                                    <td class="py-4 px-6 text-on-surface-variant" th:text="${user.email}">john@example.com</td>
                                    <td class="py-4 px-6">
                                        <span th:if="${user.role == 'ROLE_ADMIN'}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-primary-container text-on-primary-container border border-primary-container">Admin</span>
                                        <span th:if="${user.role == 'ROLE_USER'}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-surface-container-high text-on-surface-variant border border-outline-variant">Customer</span>
                                    </td>
                                    <td class="py-4 px-6 text-center">
                                        <!-- Form to toggle status disguised as a modern toggle switch -->
                                        <form th:action="@{/admin/users/toggle/{id}(id=${user.id})}" method="post" class="inline-flex items-center justify-center">
                                            <button type="submit" class="relative inline-flex h-5 w-9 items-center rounded-full transition-colors focus:outline-none" th:classappend="${user.enabled ? 'bg-secondary' : 'bg-surface-variant'}">
                                                <span class="inline-block h-3.5 w-3.5 transform rounded-full bg-white transition-transform" th:classappend="${user.enabled ? 'translate-x-4' : 'translate-x-1'}"></span>
                                            </button>
                                        </form>
                                    </td>
                                    <td class="py-4 px-6 text-right">
                                        <div class="flex items-center justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <button class="p-1.5 rounded-md text-on-surface-variant hover:text-secondary hover:bg-surface-container transition-colors" title="More Options">
                                                <span class="material-symbols-outlined text-[18px]">more_vert</span>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(users)}">
                                    <td colspan="6" class="py-8 text-center text-on-surface-variant">No users found.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Pagination -->
                    <div class="border-t border-outline-variant/50 bg-surface px-6 py-4 flex items-center justify-between">
                        <span class="font-label-sm text-label-sm text-on-surface-variant">Showing all users</span>
                        <div class="flex items-center gap-2">
                            <button class="w-8 h-8 rounded border border-outline-variant flex items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 disabled:opacity-50" disabled>
                                <span class="material-symbols-outlined text-[18px]">chevron_left</span>
                            </button>
                            <button class="w-8 h-8 rounded bg-secondary text-on-secondary font-label-sm text-label-sm flex items-center justify-center">1</button>
                            <button class="w-8 h-8 rounded border border-outline-variant flex items-center justify-center text-on-surface hover:bg-surface-variant/50 disabled:opacity-50" disabled>
                                <span class="material-symbols-outlined text-[18px]">chevron_right</span>
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</body>
</html>
