<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('View Bookings')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark"><i class="bi bi-journal-bookmark-fill text-warning"></i> Customer Bookings (Read-only)</h2>
        <span class="badge bg-secondary p-2">Phase 1 Viewer</span>
    </div>

    <!-- Bookings Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Booking ID</th>
                            <th>Customer</th>
                            <th>Flight No.</th>
                            <th>Route</th>
                            <th>Seats</th>
                            <th>Booking Date</th>
                            <th>Total Fare</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(bookings)}">
                            <td colspan="8" class="text-center py-4 text-muted">No bookings recorded yet.</td>
                        </tr>
                        <tr th:each="booking : ${bookings}">
                            <td>#<span th:text="${booking.id}">0001</span></td>
                            <td>
                                <strong th:text="${booking.user.name}">User Name</strong><br>
                                <small class="text-muted" th:text="${booking.user.email}">user@example.com</small>
                            </td>
                            <td><span class="badge bg-secondary" th:text="${booking.flight.flightNumber}">AA-101</span></td>
                            <td>
                                <span class="fw-semibold text-uppercase" th:text="${booking.flight.originAirport.airportCode}">Origin</span> 
                                <i class="bi bi-arrow-right text-muted mx-1"></i>
                                <span class="fw-semibold text-uppercase" th:text="${booking.flight.destinationAirport.airportCode}">Destination</span>
                            </td>
                            <td><code class="bg-light text-dark p-1 rounded" th:text="${booking.seatNumbers}">12A, 12B</code></td>
                            <td th:text="${#temporals.format(booking.bookingDate, 'yyyy-MM-dd HH:mm')}">Date</td>
                            <td>$<span th:text="${#numbers.formatDecimal(booking.totalFare, 1, 2)}">0.00</span></td>
                            <td>
                                <span class="badge bg-success" th:if="${booking.status == 'CONFIRMED'}">CONFIRMED</span>
                                <span class="badge bg-danger" th:if="${booking.status == 'CANCELLED'}">CANCELLED</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
