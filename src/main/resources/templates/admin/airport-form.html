<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/admin-layout :: admin_head('Airport Management')}"></head>
<body class="bg-background text-on-background font-body-md text-body-md antialiased min-h-screen flex">
    
    <nav th:replace="~{admin/admin-layout :: admin_sidebar(activePage='airports')}"></nav>

    <div class="flex-1 flex flex-col min-w-0 bg-surface">
        <header th:replace="~{admin/admin-layout :: admin_topbar}"></header>

        <main class="flex-1 overflow-y-auto p-gutter lg:p-margin-desktop">
            <div class="max-w-[700px] mx-auto">
                
                <div class="mb-8 flex items-center justify-between">
                    <div>
                        <a th:href="@{/admin/airports}" class="text-secondary hover:underline text-sm font-medium mb-2 inline-flex items-center gap-1">
                            <span class="material-symbols-outlined text-[16px]">arrow_back</span> Back to Airports
                        </a>
                        <h2 class="font-headline-md text-headline-md text-on-surface" th:text="${airport.id == null ? '✈ Add New Airport' : '✈ Edit Airport'}">Add New Airport</h2>
                    </div>
                </div>

                <div class="bg-surface rounded-xl border border-outline-variant shadow-sm overflow-hidden">
                    <form th:action="@{/admin/airports}" th:object="${airport}" method="post" class="p-6 md:p-8 space-y-6">
                        <input type="hidden" th:field="*{id}">
                        
                        <div class="space-y-4">
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label for="airportCode" class="block font-label-sm text-label-sm text-on-surface mb-2">Airport Code (IATA)</label>
                                    <input type="text" th:field="*{airportCode}" id="airportCode" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2.5 text-on-surface uppercase focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" required placeholder="e.g. JFK" maxlength="10">
                                </div>
                                <div>
                                    <label for="airportName" class="block font-label-sm text-label-sm text-on-surface mb-2">Airport Name</label>
                                    <input type="text" th:field="*{airportName}" id="airportName" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2.5 text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" required placeholder="e.g. John F. Kennedy International">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label for="city" class="block font-label-sm text-label-sm text-on-surface mb-2">City</label>
                                    <input type="text" th:field="*{city}" id="city" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2.5 text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" required placeholder="e.g. New York">
                                </div>
                                <div>
                                    <label for="country" class="block font-label-sm text-label-sm text-on-surface mb-2">Country</label>
                                    <input type="text" th:field="*{country}" id="country" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2.5 text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" required placeholder="e.g. USA">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label for="terminalCount" class="block font-label-sm text-label-sm text-on-surface mb-2">Terminal Count</label>
                                    <input type="number" th:field="*{terminalCount}" id="terminalCount" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2.5 text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" required min="1" placeholder="e.g. 6">
                                </div>
                                <div>
                                    <label for="timezone" class="block font-label-sm text-label-sm text-on-surface mb-2">Timezone</label>
                                    <input type="text" th:field="*{timezone}" id="timezone" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2.5 text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" required placeholder="e.g. America/New_York">
                                </div>
                            </div>
                            
                        </div>
                        
                        <div class="pt-6 border-t border-outline-variant flex items-center justify-end gap-3">
                            <a th:href="@{/admin/airports}" class="px-6 py-2.5 rounded-lg border border-outline-variant text-on-surface hover:bg-surface-variant/50 transition-colors font-label-sm text-label-sm">
                                Cancel
                            </a>
                            <button type="submit" class="px-6 py-2.5 rounded-lg bg-secondary text-on-secondary hover:bg-secondary-container hover:text-on-secondary-container transition-colors shadow-sm font-label-sm text-label-sm">
                                Save Airport
                            </button>
                        </div>
                        
                    </form>
                </div>

            </div>
        </main>
    </div>
</body>
</html>
