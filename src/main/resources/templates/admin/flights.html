<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Manage Flights')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark"><i class="bi bi-airplane-fill text-primary"></i> Flight Management</h2>
        <a th:href="@{/admin/flights/new}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Add New Flight</a>
    </div>

    <!-- Feedback alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}">Success message.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">Error message.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Flights Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Flight No.</th>
                            <th>Route</th>
                            <th>Departure</th>
                            <th>Arrival</th>
                            <th>Seats (Avail/Total)</th>
                            <th>Price</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(flights)}">
                            <td colspan="7" class="text-center py-4 text-muted">No flights created yet. Click "Add New Flight" to create one.</td>
                        </tr>
                        <tr th:each="flight : ${flights}">
                            <td><strong th:text="${flight.flightNumber}">AA-101</strong></td>
                            <td>
                                <span class="fw-semibold text-uppercase" th:text="${flight.origin}">Origin</span> 
                                <i class="bi bi-arrow-right text-muted mx-1"></i>
                                <span class="fw-semibold text-uppercase" th:text="${flight.destination}">Destination</span>
                            </td>
                            <td th:text="${#temporals.format(flight.departureDateTime, 'yyyy-MM-dd HH:mm')}">Departure</td>
                            <td th:text="${#temporals.format(flight.arrivalDateTime, 'yyyy-MM-dd HH:mm')}">Arrival</td>
                            <td>
                                <span class="fw-bold" th:text="${flight.availableSeats}">0</span> / 
                                <span th:text="${flight.totalSeats}">0</span>
                            </td>
                            <td>$<span th:text="${#numbers.formatDecimal(flight.price, 1, 2)}">0.00</span></td>
                            <td class="text-center">
                                <div class="btn-group" role="group">
                                    <a th:href="@{/admin/flights/edit/{id}(id=${flight.id})}" class="btn btn-sm btn-outline-secondary me-2">
                                        <i class="bi bi-pencil-square"></i> Edit
                                    </a>
                                    <form th:action="@{/admin/flights/delete/{id}(id=${flight.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this flight?');" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="bi bi-trash"></i> Delete
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
