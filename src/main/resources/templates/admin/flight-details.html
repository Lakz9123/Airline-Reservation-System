<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Flight Details')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark"><i class="bi bi-info-circle-fill text-primary"></i> Flight Details</h2>
        <a th:href="@{/admin/flights}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back to Flights</a>
    </div>

    <!-- Feedback alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}">Success message.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">Error message.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row g-4">
        <!-- Flight Info Card -->
        <div class="col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-dark text-white fw-bold">
                    <i class="bi bi-airplane"></i> General Information
                </div>
                <div class="card-body">
                    <table class="table table-borderless">
                        <tbody>
                            <tr>
                                <th class="w-25 text-muted">Flight Number</th>
                                <td>
                                    <span class="fw-bold fs-5" th:text="${flight.flightNumber}"></span>
                                    <span th:with="s=${flight.flightStatus ?: T(com.airline.reservation.entity.FlightStatus).SCHEDULED}"
                                          th:class="|badge ms-2 ${s.badgeClass}|"
                                          th:text="${s.label}"
                                          th:style="${s.name() == 'DEPARTED' ? 'background-color: #6f42c1 !important' : ''}">SCHEDULED</span>
                                </td>
                            </tr>
                            <tr>
                                <th class="text-muted">Airline</th>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <img th:if="${flight.airline.logo != null && !flight.airline.logo.isEmpty()}" 
                                             th:src="${flight.airline.logo}" 
                                             alt="Logo" class="img-thumbnail" 
                                             style="width: 50px; height: auto; max-height: 30px; object-fit: contain;">
                                        <span th:text="${flight.airline.airlineName}"></span>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th class="text-muted">Route</th>
                                <td>
                                    <span class="fw-semibold text-uppercase" th:text="${flight.originAirport.airportCode}"></span> 
                                    <i class="bi bi-arrow-right text-muted mx-1"></i>
                                    <span class="fw-semibold text-uppercase" th:text="${flight.destinationAirport.airportCode}"></span>
                                </td>
                            </tr>
                            <tr>
                                <th class="text-muted">Departure</th>
                                <td th:text="${#temporals.format(flight.departureDateTime, 'dd MMM yyyy, HH:mm')}"></td>
                            </tr>
                            <tr>
                                <th class="text-muted">Arrival</th>
                                <td th:text="${#temporals.format(flight.arrivalDateTime, 'dd MMM yyyy, HH:mm')}"></td>
                            </tr>
                            <tr>
                                <th class="text-muted">Aircraft</th>
                                <td th:text="${flight.aircraft != null ? flight.aircraft.model + ' (' + flight.aircraft.aircraftNumber + ')' : 'Unknown'}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Seat Info Card -->
        <div class="col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-primary text-white fw-bold">
                    <i class="bi bi-person-fill"></i> Seat Occupancy Summary
                </div>
                <div class="card-body text-center d-flex flex-column justify-content-center">
                    <div class="row g-3">
                        <div class="col-4">
                            <div class="p-3 border rounded bg-light">
                                <h2 class="mb-0 text-primary fw-bold" th:text="${flight.totalSeats}">0</h2>
                                <small class="text-muted text-uppercase fw-semibold">Total Seats</small>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="p-3 border rounded bg-light">
                                <h2 class="mb-0 text-success fw-bold" th:text="${flight.availableSeats}">0</h2>
                                <small class="text-muted text-uppercase fw-semibold">Available</small>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="p-3 border rounded bg-light">
                                <h2 class="mb-0 text-danger fw-bold" th:text="${flight.totalSeats - flight.availableSeats}">0</h2>
                                <small class="text-muted text-uppercase fw-semibold">Occupied</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Fares Editor Card -->
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white fw-bold">
                    <i class="bi bi-cash-stack"></i> Cabin Class Fares
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/flights/details/{id}/fares(id=${flight.id})}" method="post">
                        <div class="row g-4">
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Economy Fare (₹)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">₹</span>
                                    <input type="number" step="0.01" class="form-control" name="economyFare" th:value="${flight.economyFare}" required>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Premium Economy (₹)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">₹</span>
                                    <input type="number" step="0.01" class="form-control" name="premiumEconomyFare" th:value="${flight.premiumEconomyFare}" required>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Business Fare (₹)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">₹</span>
                                    <input type="number" step="0.01" class="form-control" name="businessFare" th:value="${flight.businessFare}" required>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">First Class Fare (₹)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">₹</span>
                                    <input type="number" step="0.01" class="form-control" name="firstClassFare" th:value="${flight.firstClassFare}" required>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-success px-4 fw-bold"><i class="bi bi-save"></i> Save Fares</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Boarding Info Card -->
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-info text-white fw-bold">
                    <i class="bi bi-door-open"></i> Boarding Information
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/flights/details/{id}/boarding(id=${flight.id})}" method="post">
                        <div class="row g-4">
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Gate Number</label>
                                <input type="text" class="form-control" name="gateNumber" th:value="${flight.gateNumber}" placeholder="e.g. G12">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Terminal</label>
                                <input type="text" class="form-control" name="terminal" th:value="${flight.terminal}" placeholder="e.g. T2">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Boarding Zone</label>
                                <input type="text" class="form-control" name="boardingZone" th:value="${flight.boardingZone}" placeholder="e.g. Zone A">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Boarding Time (auto)</label>
                                <input type="text" class="form-control" th:value="${flight.boardingTime != null ? #temporals.format(flight.boardingTime, 'dd MMM yyyy, HH:mm') : 'N/A'}" disabled>
                                <small class="text-muted">Departure − 45 min</small>
                            </div>
                        </div>
                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-info text-white px-4 fw-bold"><i class="bi bi-save"></i> Save Boarding Info</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Flight Status Card -->
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-secondary text-white fw-bold">
                    <i class="bi bi-activity"></i> Flight Status
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/flights/details/{id}/status(id=${flight.id})}" method="post" class="row g-3 align-items-center">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold mb-0">Current Status</label>
                        </div>
                        <div class="col-md-5">
                            <select class="form-select" name="flightStatus">
                                <option th:each="status : ${T(com.airline.reservation.entity.FlightStatus).values()}"
                                        th:value="${status}"
                                        th:text="${status.label}"
                                        th:selected="${flight.flightStatus == status}"></option>
                            </select>
                        </div>
                        <div class="col-md-3 text-end">
                            <button type="submit" class="btn btn-secondary fw-bold w-100"><i class="bi bi-arrow-repeat"></i> Update Status</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
