<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/admin-layout :: admin_head('Baggage Policies')}"></head>
<body class="bg-background text-on-background flex h-screen overflow-hidden antialiased">
    
    <nav th:replace="~{admin/admin-layout :: admin_sidebar(activePage='baggage')}"></nav>

    <div class="flex-1 ml-64 flex flex-col min-w-0 bg-surface-bright">
        <header th:replace="~{admin/admin-layout :: admin_topbar}"></header>

        <main class="flex-1 overflow-y-auto p-gutter lg:p-margin-desktop">
            <div class="max-w-container-max mx-auto space-y-6">
                
                <div th:if="${success}" class="bg-green-50 text-green-700 border border-green-200 rounded-lg p-4 mb-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined">check_circle</span>
                        <span th:text="${success}">Success</span>
                    </div>
                </div>

                <!-- Page Header -->
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
                    <div>
                        <h2 class="font-headline-md text-headline-md text-on-surface">Baggage Policies</h2>
                        <p class="font-body-md text-body-md text-on-surface-variant mt-1">Configure baggage allowances and extra fees across cabin classes.</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    
                    <!-- Allowances Table -->
                    <div class="lg:col-span-2 bg-surface rounded-xl border border-outline-variant shadow-sm overflow-hidden flex flex-col">
                        <div class="p-6 border-b border-outline-variant flex items-center justify-between">
                            <h3 class="font-headline-md text-lg text-on-surface font-semibold">Class Allowances</h3>
                            <span class="material-symbols-outlined text-on-surface-variant">luggage</span>
                        </div>
                        <div class="overflow-x-auto flex-1">
                            <table class="w-full text-left border-collapse min-w-[700px]">
                                <thead>
                                    <tr class="bg-surface-container-low border-b border-outline-variant">
                                        <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold">Cabin Class</th>
                                        <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold">Cabin Bag Limit</th>
                                        <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold">Checked Bags</th>
                                        <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold">Checked Limit</th>
                                        <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-outline-variant/50 font-body-md text-body-md text-on-surface">
                                    <tr th:each="allowance : ${allowances}" class="hover:bg-surface-variant/10 transition-colors">
                                        <form th:action="@{/admin/baggage/allowance/update}" method="post">
                                            <input type="hidden" name="cabinClass" th:value="${allowance.cabinClass}">
                                            
                                            <td class="py-4 px-6">
                                                <span class="font-semibold text-on-surface" th:text="${allowance.cabinClass}">Economy</span>
                                            </td>
                                            
                                            <td class="py-4 px-6">
                                                <div class="flex items-center gap-2">
                                                    <input type="number" name="cabinBagWeightLimit" th:value="${allowance.cabinBagWeightLimit}" class="w-20 bg-surface-container-low border border-outline-variant rounded-lg px-2 py-1.5 text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary text-sm" required min="0">
                                                    <span class="text-sm text-on-surface-variant">kg</span>
                                                </div>
                                            </td>
                                            
                                            <td class="py-4 px-6">
                                                <div class="flex items-center gap-2">
                                                    <input type="number" name="checkedBagCountIncluded" th:value="${allowance.checkedBagCountIncluded}" class="w-20 bg-surface-container-low border border-outline-variant rounded-lg px-2 py-1.5 text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary text-sm" required min="0">
                                                    <span class="text-sm text-on-surface-variant">bags</span>
                                                </div>
                                            </td>
                                            
                                            <td class="py-4 px-6">
                                                <div class="flex items-center gap-2">
                                                    <input type="number" name="checkedBagWeightLimit" th:value="${allowance.checkedBagWeightLimit}" class="w-20 bg-surface-container-low border border-outline-variant rounded-lg px-2 py-1.5 text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary text-sm" required min="0">
                                                    <span class="text-sm text-on-surface-variant">kg</span>
                                                </div>
                                            </td>
                                            
                                            <td class="py-4 px-6 text-right">
                                                <button type="submit" class="px-3 py-1.5 rounded-lg bg-surface-variant text-on-surface-variant font-label-sm text-label-sm hover:bg-secondary hover:text-on-secondary transition-colors">
                                                    Update
                                                </button>
                                            </td>
                                        </form>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Pricing Config -->
                    <div class="bg-surface rounded-xl border border-outline-variant shadow-sm overflow-hidden flex flex-col">
                        <div class="p-6 border-b border-outline-variant flex items-center justify-between">
                            <h3 class="font-headline-md text-lg text-on-surface font-semibold">Extra Fees</h3>
                            <span class="material-symbols-outlined text-on-surface-variant">payments</span>
                        </div>
                        <div class="p-6 flex-1">
                            <form th:action="@{/admin/baggage/pricing/update}" method="post" class="space-y-6 flex flex-col h-full">
                                
                                <div class="space-y-4 flex-1">
                                    <div>
                                        <label class="block font-label-sm text-label-sm text-on-surface mb-2">Cost Per Extra Bag (₹)</label>
                                        <div class="relative">
                                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant font-medium">$</span>
                                            <input type="number" step="0.01" name="costPerExtraBag" th:value="${pricing.costPerExtraBag}" class="w-full bg-surface-container-low border border-outline-variant rounded-lg pl-8 pr-4 py-2.5 text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" required min="0">
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label class="block font-label-sm text-label-sm text-on-surface mb-2">Cost Per Extra Kg (₹)</label>
                                        <div class="relative">
                                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant font-medium">$</span>
                                            <input type="number" step="0.01" name="costPerExtraKg" th:value="${pricing.costPerExtraKg}" class="w-full bg-surface-container-low border border-outline-variant rounded-lg pl-8 pr-4 py-2.5 text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" required min="0">
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="pt-4 mt-auto">
                                    <button type="submit" class="w-full px-4 py-2.5 rounded-lg bg-secondary text-on-secondary font-label-sm text-label-sm hover:bg-secondary-container hover:text-on-secondary-container transition-colors shadow-sm flex items-center justify-center gap-2">
                                        <span class="material-symbols-outlined text-[18px]">save</span>
                                        Save Pricing
                                    </button>
                                </div>
                                
                            </form>
                        </div>
                    </div>

                </div>

            </div>
            <div class="-mx-4 -mb-4 md:-mx-6 md:-mb-6 lg:-mx-8 lg:-mb-8 mt-12">
        <footer th:replace="~{layout :: footer}"></footer>
    </div>
</main>
    </div>
</body>
</html>
