<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Manage Coupons')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-ticket-perforated-fill text-primary"></i> Coupon Management</h2>
        <a th:href="@{/admin/coupons/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Add Coupon
        </a>
    </div>

    <!-- Alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Code</th>
                        <th>Type</th>
                        <th>Value</th>
                        <th>Validity (From → Until)</th>
                        <th>Limits &amp; Usage</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${coupons}">
                        <td><strong th:text="${c.code}" class="text-primary"></strong></td>
                        <td>
                            <span class="badge bg-secondary" th:text="${c.discountType}"></span>
                        </td>
                        <td>
                            <span th:if="${c.discountType.name() == 'PERCENTAGE'}" th:text="${c.discountValue + '%'}"></span>
                            <span th:if="${c.discountType.name() == 'FLAT'}" th:text="${'₹' + c.discountValue}"></span>
                            <small class="text-muted d-block" th:if="${c.maxDiscountAmount != null}">Max ₹<span th:text="${c.maxDiscountAmount}"></span></small>
                            <small class="text-muted d-block" th:if="${c.minBookingAmount != null}">Min ₹<span th:text="${c.minBookingAmount}"></span></small>
                        </td>
                        <td>
                            <span th:text="${c.validFrom}"></span> →
                            <span th:text="${c.expiryDate}"></span>
                        </td>
                        <td th:with="count=${@couponService.getUsageCount(c)}">
                            <small class="d-block">Total Limit: <strong th:text="${c.usageLimit != null ? c.usageLimit : '∞'}"></strong></small>
                            <small class="d-block text-primary">Used: <strong th:text="${count}"></strong></small>
                            <small class="d-block text-success">Remaining: <strong th:text="${c.usageLimit != null ? (c.usageLimit - count) : '∞'}"></strong></small>
                            <small class="d-block">Per User: <strong th:text="${c.usageLimitPerUser != null ? c.usageLimitPerUser : '∞'}"></strong></small>
                        </td>
                        <td>
                            <form th:action="@{/admin/coupons/toggle/{id}(id=${c.id})}" method="post" class="m-0 p-0">
                                <button type="submit" class="btn btn-sm text-white"
                                        th:classappend="${c.active ? 'btn-success' : 'btn-danger'}"
                                        th:text="${c.active ? 'Active' : 'Inactive'}"></button>
                            </form>
                        </td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/admin/coupons/edit/{id}(id=${c.id})}" class="btn btn-outline-primary" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/admin/coupons/delete/{id}(id=${c.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Delete this coupon?');">
                                    <button type="submit" class="btn btn-outline-danger" title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(coupons)}">
                        <td colspan="7" class="text-center py-5 text-muted">
                            <i class="bi bi-ticket-perforated display-5 d-block mb-2"></i>
                            No coupons found. <a th:href="@{/admin/coupons/new}">Add the first one!</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
