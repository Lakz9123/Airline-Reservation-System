<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Manage Coupons', ~{::section})}">
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Coupon Management</h2>
        <a th:href="@{/admin/coupons/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Add Coupon
        </a>
    </div>

    <!-- Alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Code</th>
                        <th>Type</th>
                        <th>Value</th>
                        <th>Validity (From - Until)</th>
                        <th>Limits & Usage</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${coupons}">
                        <td><strong th:text="${c.code}"></strong></td>
                        <td>
                            <span class="badge bg-secondary" th:text="${c.discountType}"></span>
                        </td>
                        <td>
                            <span th:if="${c.discountType.name() == 'PERCENTAGE'}" th:text="${c.discountValue + '%'}"></span>
                            <span th:if="${c.discountType.name() == 'FLAT'}" th:text="${'₹' + c.discountValue}"></span>
                            <small class="text-muted d-block" th:if="${c.maxDiscountAmount != null}">Max ₹<span th:text="${c.maxDiscountAmount}"></span></small>
                            <small class="text-muted d-block" th:if="${c.minBookingAmount != null}">Min ₹<span th:text="${c.minBookingAmount}"></span></small>
                        </td>
                        <td th:text="${c.validFrom} + ' to ' + ${c.expiryDate}"></td>
                        <td th:with="count=${@couponService.getUsageCount(c)}">
                            <small class="d-block">Total Limit: <span th:text="${c.usageLimit != null ? c.usageLimit : '∞'}"></span></small>
                            <small class="d-block text-primary">Remaining: <span th:text="${c.usageLimit != null ? (c.usageLimit - count) : '∞'}"></span></small>
                            <small class="d-block">Per User: <span th:text="${c.usageLimitPerUser != null ? c.usageLimitPerUser : '∞'}"></span></small>
                        </td>
                        <td>
                            <form th:action="@{/admin/coupons/toggle/{id}(id=${c.id})}" method="post" class="m-0 p-0">
                                <button type="submit" class="btn btn-sm text-white" th:classappend="${c.isActive ? 'btn-success' : 'btn-danger'}" th:text="${c.isActive ? 'Active' : 'Inactive'}"></button>
                            </form>
                        </td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/admin/coupons/edit/{id}(id=${c.id})}" class="btn btn-outline-primary" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/admin/coupons/delete/{id}(id=${c.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this coupon?');">
                                    <button type="submit" class="btn btn-outline-danger" title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(coupons)}">
                        <td colspan="7" class="text-center py-4 text-muted">No coupons found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
