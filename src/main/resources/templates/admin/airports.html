<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Airport Management')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark"><i class="bi bi-geo-alt text-primary"></i> Airport Registry</h2>
        <a th:href="@{/admin/airports/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Add Airport
        </a>
    </div>

    <!-- Feedback alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}">Success message.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">Error message.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Airports Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Code</th>
                            <th>Airport Name</th>
                            <th>City</th>
                            <th>Country</th>
                            <th>Terminals</th>
                            <th>Timezone</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(airports)}">
                            <td colspan="8" class="text-center py-4 text-muted">No airports registered yet.</td>
                        </tr>
                        <tr th:each="airport : ${airports}">
                            <td>#<span th:text="${airport.id}">1</span></td>
                            <td><span class="badge bg-primary fs-6" th:text="${airport.airportCode}">MAA</span></td>
                            <td><strong th:text="${airport.airportName}">Chennai International Airport</strong></td>
                            <td th:text="${airport.city}">Chennai</td>
                            <td th:text="${airport.country}">India</td>
                            <td th:text="${airport.terminalCount != null ? airport.terminalCount : 'N/A'}">4</td>
                            <td th:text="${airport.timezone != null ? airport.timezone : 'N/A'}">GMT+5:30</td>
                            <td class="text-center">
                                <a th:href="@{/admin/airports/edit/{id}(id=${airport.id})}" class="btn btn-sm btn-outline-secondary me-2">
                                    <i class="bi bi-pencil"></i> Edit
                                </a>
                                <form th:action="@{/admin/airports/delete/{id}(id=${airport.id})}" method="post" style="display:inline;"
                                      onsubmit="return confirm('Are you sure you want to delete this airport? This might break existing flights.')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i> Delete
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
