<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Airline Management')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark"><i class="bi bi-airplane-engines text-primary"></i> Airline Directory</h2>
        <a th:href="@{/admin/airlines/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Add Airline
        </a>
    </div>

    <!-- Feedback alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}">Success message.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">Error message.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Airlines Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Logo</th>
                            <th>Airline Name</th>
                            <th>Country</th>
                            <th>Website</th>
                            <th>Support Email</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(airlines)}">
                            <td colspan="7" class="text-center py-4 text-muted">No airlines registered yet.</td>
                        </tr>
                        <tr th:each="airline : ${airlines}">
                            <td>#<span th:text="${airline.id}">1</span></td>
                            <td>
                                <img th:if="${airline.logo != null && !airline.logo.isEmpty()}" 
                                     th:src="${airline.logo}" 
                                     alt="Logo" 
                                     class="img-thumbnail" 
                                     style="width: 80px; height: auto; max-height: 50px; object-fit: contain;">
                                <span th:if="${airline.logo == null || airline.logo.isEmpty()}" class="text-muted"><i class="bi bi-image"></i></span>
                            </td>
                            <td><strong th:text="${airline.airlineName}">Air India</strong></td>
                            <td th:text="${airline.country}">India</td>
                            <td>
                                <a th:if="${airline.website != null && !airline.website.isEmpty()}" 
                                   th:href="${airline.website}" 
                                   target="_blank" 
                                   class="text-decoration-none">
                                    <i class="bi bi-link-45deg"></i> Visit Website
                                </a>
                                <span th:if="${airline.website == null || airline.website.isEmpty()}" class="text-muted">-</span>
                            </td>
                            <td>
                                <a th:href="'mailto:' + ${airline.supportEmail}" th:text="${airline.supportEmail}">support@airline.com</a>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/admin/airlines/edit/{id}(id=${airline.id})}" class="btn btn-sm btn-outline-secondary me-2">
                                    <i class="bi bi-pencil"></i> Edit
                                </a>
                                <form th:action="@{/admin/airlines/delete/{id}(id=${airline.id})}" method="post" style="display:inline;"
                                      onsubmit="return confirm('Are you sure you want to delete this airline? Existing flights referencing it will block deletion.')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i> Delete
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
