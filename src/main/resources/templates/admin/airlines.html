<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/admin-layout :: admin_head('Airline Management')}"></head>
<body class="bg-background text-on-background flex h-screen overflow-hidden antialiased">
    
    <nav th:replace="~{admin/admin-layout :: admin_sidebar(activePage='airlines')}"></nav>

    <div class="flex-1 ml-64 flex flex-col min-w-0 bg-surface-bright">
        <header th:replace="~{admin/admin-layout :: admin_topbar}"></header>

        <main class="flex-1 overflow-y-auto p-gutter lg:p-margin-desktop">
            <div class="max-w-container-max mx-auto space-y-6">
                
                <div th:if="${success}" class="bg-green-50 text-green-700 border border-green-200 rounded-lg p-4 mb-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined">check_circle</span>
                        <span th:text="${success}">Success</span>
                    </div>
                </div>
                
                <div th:if="${error}" class="bg-red-50 text-red-700 border border-red-200 rounded-lg p-4 mb-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined">error</span>
                        <span th:text="${error}">Error</span>
                    </div>
                </div>

                <!-- Page Header -->
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
                    <div>
                        <h2 class="font-headline-md text-headline-md text-on-surface">Airline Partners</h2>
                        <p class="font-body-md text-body-md text-on-surface-variant mt-1">Manage partner airlines and their operational details.</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button class="flex items-center gap-2 px-4 py-2 border border-outline-variant rounded-lg text-on-surface font-label-sm text-label-sm hover:bg-surface-variant/50 transition-colors">
                            <span class="material-symbols-outlined text-[18px]">filter_list</span>
                            Filter
                        </button>
                        <a th:href="@{/admin/airlines/new}" class="flex items-center gap-2 px-4 py-2 bg-secondary text-on-secondary rounded-lg font-label-sm text-label-sm hover:bg-secondary-container transition-colors shadow-sm">
                            <span class="material-symbols-outlined text-[18px]">add_circle</span>
                            Add Airline
                        </a>
                    </div>
                </div>

                <!-- Table Card -->
                <div class="bg-surface rounded-xl border border-outline-variant shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[900px]">
                            <thead>
                                <tr class="bg-surface-container-low border-b border-outline-variant">
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold">Airline</th>
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold">Country</th>
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold">Website</th>
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold">Support Contact</th>
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold text-center">Status</th>
                                    <th class="py-4 px-6 font-label-sm text-label-sm text-on-surface-variant font-semibold text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-outline-variant/50 font-body-md text-body-md text-on-surface">
                                <tr th:each="airline : ${airlines}" class="hover:bg-surface-variant/10 transition-colors group">
                                    <td class="py-4 px-6 flex items-center gap-3">
                                        <div class="w-10 h-10 rounded bg-white border border-outline-variant flex items-center justify-center shrink-0 overflow-hidden">
                                            <img th:if="${airline.logo != null && !airline.logo.isEmpty()}" th:src="${airline.logo}" alt="Logo" class="max-w-full max-h-full object-contain">
                                            <span th:if="${airline.logo == null || airline.logo.isEmpty()}" class="material-symbols-outlined text-outline-variant">flight</span>
                                        </div>
                                        <div class="font-medium text-on-surface" th:text="${airline.airlineName}">SkyFly Elite</div>
                                    </td>
                                    <td class="py-4 px-6">
                                        <div class="flex items-center gap-2">
                                            <span class="material-symbols-outlined text-on-surface-variant text-[16px]">public</span>
                                            <span th:text="${airline.country}">USA</span>
                                        </div>
                                    </td>
                                    <td class="py-4 px-6">
                                        <a th:if="${airline.website != null && !airline.website.isEmpty()}" th:href="${airline.website}" target="_blank" class="text-secondary hover:underline flex items-center gap-1 text-sm">
                                            <span class="material-symbols-outlined text-[14px]">link</span> Visit
                                        </a>
                                        <span th:if="${airline.website == null || airline.website.isEmpty()}" class="text-on-surface-variant text-sm">-</span>
                                    </td>
                                    <td class="py-4 px-6 text-on-surface-variant text-sm">
                                        <a th:href="'mailto:' + ${airline.supportEmail}" th:text="${airline.supportEmail}" class="hover:text-secondary hover:underline">support@example.com</a>
                                    </td>
                                    <td class="py-4 px-6 text-center">
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-green-50 text-green-700 border border-green-200">Active</span>
                                    </td>
                                    <td class="py-4 px-6 text-right">
                                        <div class="flex items-center justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <a th:href="@{/admin/airlines/edit/{id}(id=${airline.id})}" class="p-1.5 rounded-md text-on-surface-variant hover:text-secondary hover:bg-surface-container transition-colors" title="Edit">
                                                <span class="material-symbols-outlined text-[18px]">edit</span>
                                            </a>
                                            <form th:action="@{/admin/airlines/delete/{id}(id=${airline.id})}" method="post" class="inline" onsubmit="return confirm('Are you sure you want to delete this airline? Existing flights referencing it will block deletion.')">
                                                <button type="submit" class="p-1.5 rounded-md text-on-surface-variant hover:text-error hover:bg-error-container/20 transition-colors" title="Delete">
                                                    <span class="material-symbols-outlined text-[18px]">delete</span>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(airlines)}">
                                    <td colspan="6" class="py-8 text-center text-on-surface-variant">No airlines recorded yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
        <footer th:replace="~{layout :: footer}"></footer>
    </div>
</body>
</html>
