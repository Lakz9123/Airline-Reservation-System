<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Manage Aircraft')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <span class="eyebrow-label">Fleet Management</span>
            <h1 class="section-title mb-0">Aircraft Management</h1>
        </div>
        <a th:href="@{/admin/aircraft/new}" class="btn-primary-theme">
            <i class="bi bi-plus-circle"></i> Add Aircraft
        </a>
    </div>

    <!-- Alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show border-0 rounded-4 mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show border-0 rounded-4 mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr class="text-uppercase small font-monospace text-muted">
                        <th class="ps-4 py-3">Name</th>
                        <th class="py-3">Reg. Number</th>
                        <th class="py-3">Model</th>
                        <th class="py-3">Capacity</th>
                        <th class="py-3">Status</th>
                        <th class="pe-4 py-3 text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ac : ${aircrafts}">
                        <td class="ps-4 py-3 fw-semibold" th:text="${ac.aircraftName}">Name</td>
                        <td class="py-3"><code class="text-muted font-monospace" th:text="${ac.aircraftNumber}">VT-ABC</code></td>
                        <td class="py-3" th:text="${ac.model}">Model</td>
                        <td class="py-3">
                            <strong th:text="${ac.capacity}"></strong> total
                            <small class="text-muted d-block">
                                <span th:text="${ac.businessSeats}"></span> Bus. / <span th:text="${ac.economySeats}"></span> Eco.
                            </small>
                        </td>
                        <td class="py-3">
                            <span class="badge rounded-pill px-3 py-2"
                                  th:classappend="${ac.status.name() == 'ACTIVE' ? 'bg-success-subtle text-success border border-success-subtle' : (ac.status.name() == 'MAINTENANCE' ? 'bg-warning-subtle text-warning border border-warning-subtle' : 'bg-secondary-subtle text-secondary border')}"
                                  th:text="${ac.status}">ACTIVE</span>
                        </td>
                        <td class="pe-4 py-3 text-end">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/admin/aircraft/edit/{id}(id=${ac.id})}" class="btn btn-outline-primary rounded-3 me-1" title="Edit">
                                    <i class="bi bi-pencil"></i> Edit
                                </a>
                                <form th:action="@{/admin/aircraft/delete/{id}(id=${ac.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this aircraft?');">
                                    <button type="submit" class="btn btn-outline-danger rounded-3" title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(aircrafts)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="bi bi-airplane display-4 d-block mb-3 text-muted opacity-50"></i>
                            No aircraft registered yet.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
