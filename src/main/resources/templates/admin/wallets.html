<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Manage Wallets')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-md-2">
            <!-- Optional sidebar can go here, or we just rely on navbar -->
        </div>
        <div class="col-md-10 offset-md-1">
            <h2 class="mb-4">User Wallets Overview</h2>
            
            <div class="card shadow">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>User ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Wallet Balance</th>
                                    <th>Reward Points</th>
                                    <th>Last Updated</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="wallet : ${wallets}">
                                    <td th:text="${wallet.user.id}"></td>
                                    <td th:text="${wallet.user.name}"></td>
                                    <td th:text="${wallet.user.email}"></td>
                                    <td class="fw-bold text-success">₹<span th:text="${#numbers.formatDecimal(wallet.balance, 1, 2)}"></span></td>
                                    <td class="text-warning fw-bold"><i class="bi bi-star-fill"></i> <span th:text="${wallet.rewardPoints}"></span></td>
                                    <td th:text="${#temporals.format(wallet.updatedAt, 'dd MMM yyyy HH:mm')}"></td>
                                    <td>
                                        <a th:href="@{/admin/wallets/{userId}(userId=${wallet.user.id})}" class="btn btn-sm btn-outline-primary">View Transactions</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
