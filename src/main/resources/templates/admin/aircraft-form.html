<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head(${aircraft.id == null ? 'Add Aircraft' : 'Edit Aircraft'})}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container">
    <div class="mb-4">
        <span class="eyebrow-label">Fleet Management</span>
        <h1 class="section-title mb-0" th:text="${aircraft.id == null ? 'Add New Aircraft' : 'Edit Aircraft'}">Aircraft Form</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0">
                <div class="card-body p-4 p-md-5">
                    <div th:if="${error}" class="alert alert-danger border-0 rounded-4 mb-4" th:text="${error}"></div>

                    <form th:action="@{/admin/aircraft}" method="post" th:object="${aircraft}">
                        <input type="hidden" th:field="*{id}" />

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="aircraftName" class="form-label fw-bold text-uppercase small text-muted">Aircraft Name</label>
                                <input type="text" class="form-control" id="aircraftName" th:field="*{aircraftName}" placeholder="e.g. Skyline Explorer" required>
                            </div>
                            <div class="col-md-6">
                                <label for="aircraftNumber" class="form-label fw-bold text-uppercase small text-muted">Registration Number</label>
                                <input type="text" class="form-control" id="aircraftNumber" th:field="*{aircraftNumber}" placeholder="e.g. VT-ABC" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="model" class="form-label fw-bold text-uppercase small text-muted">Model</label>
                                <input type="text" class="form-control" id="model" th:field="*{model}" placeholder="e.g. Boeing 737" required>
                            </div>
                            <div class="col-md-6">
                                <label for="status" class="form-label fw-bold text-uppercase small text-muted">Status</label>
                                <select class="form-select" id="status" th:field="*{status}" required>
                                    <option value="" disabled>Select status...</option>
                                    <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label for="capacity" class="form-label fw-bold text-uppercase small text-muted">Total Capacity</label>
                                <input type="number" class="form-control" id="capacity" th:field="*{capacity}" min="1" required>
                            </div>
                            <div class="col-md-4">
                                <label for="businessSeats" class="form-label fw-bold text-uppercase small text-muted">Business Seats</label>
                                <input type="number" class="form-control" id="businessSeats" th:field="*{businessSeats}" min="0" required>
                            </div>
                            <div class="col-md-4">
                                <label for="economySeats" class="form-label fw-bold text-uppercase small text-muted">Economy Seats</label>
                                <input type="number" class="form-control" id="economySeats" th:field="*{economySeats}" min="0" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between gap-3">
                            <a th:href="@{/admin/aircraft}" class="btn-outline-theme py-3 px-4 flex-grow-1 text-center">
                                <i class="bi bi-arrow-left me-1"></i> Cancel
                            </a>
                            <button type="submit" class="btn-primary-theme py-3 px-4 flex-grow-1">
                                <i class="bi bi-save me-1"></i> Save Aircraft
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
