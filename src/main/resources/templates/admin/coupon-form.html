<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(${coupon.id == null ? 'Add Coupon' : 'Edit Coupon'}, ~{::section})}">
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${coupon.id == null ? 'Add New Coupon' : 'Edit Coupon'}"></h2>
        <a th:href="@{/admin/coupons}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back to List
        </a>
    </div>

    <div class="card shadow-sm max-w-md mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">
            <form th:action="@{/admin/coupons/save}" th:object="${coupon}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label fw-bold">Coupon Code <span class="text-danger">*</span></label>
                    <input type="text" class="form-control text-uppercase" th:field="*{code}" required placeholder="e.g. SUMMER50">
                    <small class="form-text text-muted">Codes are automatically converted to uppercase.</small>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Discount Type <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{discountType}" required>
                            <option value="PERCENTAGE">Percentage (%)</option>
                            <option value="FLAT">Flat Amount (₹)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Discount Value <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" th:field="*{discountValue}" required min="0" step="0.01" placeholder="e.g. 10 or 500">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Max Discount (₹)</label>
                        <input type="number" class="form-control" th:field="*{maxDiscountAmount}" min="0" step="0.01" placeholder="Leave empty for none">
                        <small class="form-text text-muted">Applicable for Percentage type.</small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Min Booking Amount (₹)</label>
                        <input type="number" class="form-control" th:field="*{minBookingAmount}" min="0" step="0.01" placeholder="Leave empty for none">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Total Usage Limit</label>
                        <input type="number" class="form-control" th:field="*{usageLimit}" min="1" placeholder="Leave empty for unlimited">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Usage Limit Per User</label>
                        <input type="number" class="form-control" th:field="*{usageLimitPerUser}" min="1" placeholder="Leave empty for unlimited">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Expiry Date <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" th:field="*{expiryDate}" required>
                </div>

                <div class="mb-4 form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" th:field="*{active}" id="isActiveSwitch">
                    <label class="form-check-label fw-bold" for="isActiveSwitch">Coupon is Active</label>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Save Coupon
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
