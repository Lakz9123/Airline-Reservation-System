<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head(${flight.id == null ? 'Add Flight' : 'Edit Flight'})}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi" th:classappend="${flight.id == null ? 'bi-plus-circle' : 'bi-pencil-square'}"></i>
                        <span th:text="${flight.id == null ? 'Add New Flight' : 'Edit Flight'}">Flight Form</span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/flights}" th:object="${flight}" method="post">
                        <!-- Hidden ID for updates -->
                        <input type="hidden" th:field="*{id}">
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="flightNumber" class="form-label fw-semibold">Flight Number</label>
                                <input type="text" th:field="*{flightNumber}" class="form-control" id="flightNumber" required placeholder="e.g. AA-101">
                            </div>
                            <div class="col-md-6">
                                <label for="airline" class="form-label fw-semibold">Airline</label>
                                <select th:field="*{airline.id}" class="form-select" id="airline" required>
                                    <option value="" disabled selected>Select Airline</option>
                                    <option th:each="al : ${airlines}" th:value="${al.id}" th:text="${al.airlineName} + ' (' + ${al.country} + ')'"></option>
                                </select>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="originAirport" class="form-label fw-semibold">Origin Airport</label>
                                <select th:field="*{originAirport.id}" class="form-select" id="originAirport" required>
                                    <option value="" disabled selected>Select Origin</option>
                                    <option th:each="ap : ${airports}" th:value="${ap.id}" th:text="${ap.airportCode} + ' - ' + ${ap.airportName} + ', ' + ${ap.city}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="destinationAirport" class="form-label fw-semibold">Destination Airport</label>
                                <select th:field="*{destinationAirport.id}" class="form-select" id="destinationAirport" required>
                                    <option value="" disabled selected>Select Destination</option>
                                    <option th:each="ap : ${airports}" th:value="${ap.id}" th:text="${ap.airportCode} + ' - ' + ${ap.airportName} + ', ' + ${ap.city}"></option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="departureDateTime" class="form-label fw-semibold">Departure Date & Time</label>
                                <input type="datetime-local" th:field="*{departureDateTime}" class="form-control" id="departureDateTime" required>
                            </div>
                            <div class="col-md-6">
                                <label for="arrivalDateTime" class="form-label fw-semibold">Arrival Date & Time</label>
                                <input type="datetime-local" th:field="*{arrivalDateTime}" class="form-control" id="arrivalDateTime" required>
                            </div>

                            <div class="col-md-4">
                                <label for="fare" class="form-label fw-semibold">Fare (₹)</label>
                                <input type="number" step="0.01" th:field="*{fare}" class="form-control" id="fare" required placeholder="0.00" min="0">
                            </div>
                            <div class="col-md-4">
                                <label for="aircraft" class="form-label">Aircraft</label>
                                <select class="form-select" id="aircraft" th:field="*{aircraft}" required>
                                    <option value="" disabled>Select aircraft...</option>
                                    <option th:each="ac : ${aircrafts}" th:value="${ac.id}" th:text="${ac.aircraftName + ' (' + ac.aircraftNumber + ') - Cap: ' + ac.capacity}"></option>
                                </select>
                            </div>
                            <div class="col-md-4" th:if="${flight.id != null}">
                                <label for="availableSeats" class="form-label fw-semibold">Available Seats (Read-only)</label>
                                <input type="number" th:field="*{availableSeats}" class="form-control" id="availableSeats" readonly>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/admin/flights}" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i> Cancel</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Save Flight</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
