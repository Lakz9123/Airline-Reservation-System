<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head(${flight.id == null ? 'Add Flight' : 'Edit Flight'})}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi" th:classappend="${flight.id == null ? 'bi-plus-circle' : 'bi-pencil-square'}"></i>
                        <span th:text="${flight.id == null ? 'Add New Flight' : 'Edit Flight'}">Flight Form</span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/flights}" th:object="${flight}" method="post">
                        <!-- Hidden ID for updates -->
                        <input type="hidden" th:field="*{id}">
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="flightNumber" class="form-label fw-semibold">Flight Number</label>
                                <input type="text" th:field="*{flightNumber}" class="form-control" id="flightNumber" required placeholder="e.g. AA-123">
                            </div>
                            <div class="col-md-6">
                                <label for="price" class="form-label fw-semibold">Ticket Price ($)</label>
                                <input type="number" step="0.01" th:field="*{price}" class="form-control" id="price" required placeholder="0.00" min="0">
                            </div>
                            
                            <div class="col-md-6">
                                <label for="origin" class="form-label fw-semibold">Origin</label>
                                <input type="text" th:field="*{origin}" class="form-control" id="origin" required placeholder="e.g. Dubai">
                            </div>
                            <div class="col-md-6">
                                <label for="destination" class="form-label fw-semibold">Destination</label>
                                <input type="text" th:field="*{destination}" class="form-control" id="destination" required placeholder="e.g. Paris">
                            </div>

                            <div class="col-md-6">
                                <label for="departureDateTime" class="form-label fw-semibold">Departure Date & Time</label>
                                <input type="datetime-local" th:field="*{departureDateTime}" class="form-control" id="departureDateTime" required>
                            </div>
                            <div class="col-md-6">
                                <label for="arrivalDateTime" class="form-label fw-semibold">Arrival Date & Time</label>
                                <input type="datetime-local" th:field="*{arrivalDateTime}" class="form-control" id="arrivalDateTime" required>
                            </div>

                            <div class="col-md-6">
                                <label for="totalSeats" class="form-label fw-semibold">Total Seats</label>
                                <input type="number" th:field="*{totalSeats}" class="form-control" id="totalSeats" required min="1" placeholder="e.g. 150">
                            </div>
                            <div class="col-md-6" th:if="${flight.id != null}">
                                <label for="availableSeats" class="form-label fw-semibold">Available Seats (Read-only)</label>
                                <input type="number" th:field="*{availableSeats}" class="form-control" id="availableSeats" readonly>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/admin/flights}" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i> Cancel</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Save Flight</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
