<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/admin-layout :: admin_head('Airline Management')}"></head>
<body class="bg-background text-on-background flex flex-col min-h-screen overflow-x-hidden antialiased">
    
    <div class="flex flex-1 w-full relative">
    
    <nav th:replace="~{admin/admin-layout :: admin_sidebar(activePage='airlines')}"></nav>

    <div class="flex-1 flex flex-col min-w-0 bg-surface-bright w-full">
        <header th:replace="~{admin/admin-layout :: admin_topbar}"></header>

        <main class="flex-1 p-gutter lg:p-margin-desktop flex flex-col">
            <div class="max-w-[700px] mx-auto">
                
                <div class="mb-8 flex items-center justify-between">
                    <div>
                        <a th:href="@{/admin/airlines}" class="text-secondary hover:underline text-sm font-medium mb-2 inline-flex items-center gap-1">
                            <span class="material-symbols-outlined text-[16px]">arrow_back</span> Back to Airlines
                        </a>
                        <h2 class="font-headline-md text-headline-md text-on-surface" th:text="${airline.id == null ? '✈ Add New Airline' : '✈ Edit Airline'}">Add New Airline</h2>
                    </div>
                </div>

                <div class="bg-surface rounded-xl border border-outline-variant shadow-sm overflow-hidden">
                    <form th:action="@{/admin/airlines}" th:object="${airline}" method="post" class="p-6 md:p-8 space-y-6">
                        <input type="hidden" th:field="*{id}">
                        
                        <div class="space-y-4">
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label for="airlineName" class="block font-label-sm text-label-sm text-on-surface mb-2">Airline Name</label>
                                    <input type="text" th:field="*{airlineName}" id="airlineName" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2.5 text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" required placeholder="e.g. IndiGo">
                                </div>
                                <div>
                                    <label for="country" class="block font-label-sm text-label-sm text-on-surface mb-2">Country</label>
                                    <input type="text" th:field="*{country}" id="country" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2.5 text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" required placeholder="e.g. India">
                                </div>
                            </div>

                            <div>
                                <label for="logo" class="block font-label-sm text-label-sm text-on-surface mb-2">Logo URL</label>
                                <input type="text" th:field="*{logo}" id="logo" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2.5 text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" placeholder="e.g. https://example.com/logo.png">
                            </div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label for="website" class="block font-label-sm text-label-sm text-on-surface mb-2">Website</label>
                                    <input type="url" th:field="*{website}" id="website" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2.5 text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" placeholder="https://...">
                                </div>
                                <div>
                                    <label for="supportEmail" class="block font-label-sm text-label-sm text-on-surface mb-2">Support Email</label>
                                    <input type="email" th:field="*{supportEmail}" id="supportEmail" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2.5 text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" required placeholder="support@airline.com">
                                </div>
                            </div>
                            
                        </div>
                        
                        <div class="pt-6 border-t border-outline-variant flex items-center justify-end gap-3">
                            <a th:href="@{/admin/airlines}" class="px-6 py-2.5 rounded-lg border border-outline-variant text-on-surface hover:bg-surface-variant/50 transition-colors font-label-sm text-label-sm">
                                Cancel
                            </a>
                            <button type="submit" class="px-6 py-2.5 rounded-lg bg-secondary text-on-secondary hover:bg-secondary-container hover:text-on-secondary-container transition-colors shadow-sm font-label-sm text-label-sm">
                                Save Airline
                            </button>
                        </div>
                        
                    </form>
                </div>

            </div>
</main>
    </div>
    </div>
    <div class="w-full relative" style="z-index: 60;">
        <footer th:replace="~{admin/admin-layout :: admin_footer}"></footer>
    </div>
</body>
</html>
