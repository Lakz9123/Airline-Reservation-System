<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head(${airline.id == null ? 'Add Airline' : 'Edit Airline'})}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi" th:classappend="${airline.id == null ? 'bi-plus-circle' : 'bi-pencil-square'}"></i>
                        <span th:text="${airline.id == null ? 'Add New Airline' : 'Edit Airline'}">Airline Form</span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/airlines}" th:object="${airline}" method="post">
                        <!-- Hidden ID for updates -->
                        <input type="hidden" th:field="*{id}">
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="airlineName" class="form-label fw-semibold">Airline Name</label>
                                <input type="text" th:field="*{airlineName}" class="form-control" id="airlineName" required placeholder="e.g. IndiGo">
                            </div>
                            <div class="col-md-6">
                                <label for="logo" class="form-label fw-semibold">Logo Image URL</label>
                                <input type="text" th:field="*{logo}" class="form-control" id="logo" placeholder="e.g. /images/indigo-logo.png">
                            </div>
                            
                            <div class="col-md-6">
                                <label for="country" class="form-label fw-semibold">Country</label>
                                <input type="text" th:field="*{country}" class="form-control" id="country" required placeholder="e.g. India">
                            </div>
                            <div class="col-md-6">
                                <label for="website" class="form-label fw-semibold">Website</label>
                                <input type="url" th:field="*{website}" class="form-control" id="website" placeholder="e.g. https://www.goindigo.in">
                            </div>

                            <div class="col-md-12">
                                <label for="supportEmail" class="form-label fw-semibold">Support Email</label>
                                <input type="email" th:field="*{supportEmail}" class="form-control" id="supportEmail" required placeholder="e.g. support@indigo.in">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/admin/airlines}" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i> Cancel</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Save Airline</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: html_scripts}"></div>
</body>
</html>
