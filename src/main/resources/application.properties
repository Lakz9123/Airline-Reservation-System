# Server Configuration
server.port=8080

# Database Configuration (H2 File-Based - data persists across restarts)
# DB_CLOSE_DELAY=-1: keep DB alive for entire JVM lifetime
# (removing DB_CLOSE_ON_EXIT=FALSE restores the default shutdown hook so data is flushed to disk on exit)
spring.datasource.url=jdbc:h2:file:./data/airline_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Thymeleaf configuration
spring.thymeleaf.cache=false

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.airline.reservation=DEBUG

# Mail Configuration (disabled for local dev)
spring.mail.host=${SMTP_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SMTP_PORT:2525}
