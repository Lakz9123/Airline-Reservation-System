<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .input-focus-ring:focus {
            outline: none;
            border-color: #1E90FF;
            box-shadow: 0 0 0 4px rgba(30, 144, 255, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md h-screen flex flex-col overflow-hidden">
<!-- TopNavBar (Modified for Transactional Intent) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md border-b border-outline-variant/30 shadow-sm h-20 flex justify-between items-center px-margin-mobile md:px-margin-desktop">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">flight</span>
<span class="text-headline-md font-headline-md text-secondary tracking-tight">SkyFly Elite</span>
</div>
<nav class="hidden md:flex gap-8">
<!-- Navigation hidden as per instructions for transactional pages, but keeping structure if needed, just empty or simplified -->
</nav>
<a class="text-secondary font-label-sm hover:bg-surface-container-high/50 transition-all duration-300 px-4 py-2 rounded-lg flex items-center gap-2" href="#">
<span class="material-symbols-outlined text-sm">arrow_back</span>
            Back to Home
        </a>
</header>
<!-- Main Split Layout -->
<main class="flex-1 flex flex-col md:flex-row pt-20 h-full">
<!-- Left Panel: Image -->
<div class="hidden md:block md:w-1/2 relative bg-surface-container-highest">
<div class="absolute inset-0 bg-gradient-to-t from-secondary-container/40 to-transparent z-10 mix-blend-overlay"></div>
<img alt="" class="absolute inset-0 w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLsxDSbbfxugjQSIu5kEmf7lyKYvTSBuQxTCPSgWP_BYwqbb7tojGx0tJngT8MRhXDVPBZQdOXLmTC3XHK9m7d4uX6cBqnmeBxZbx3oplHVS3SXjlQ9qY8VLTsPaK3RksNrhp6HayClWp78uVboSfDWim_GZLZvkWjajI-3wNdxGSzInZZZzY9P1sv9Q1Gs9BWFV-nOXq5eF6_fXW6xbWMJ5RT05YntW0wxwzjIsOKO0LHISKpRmGCFnOkCx"/>
</div>
<!-- Right Panel: Login Form -->
<div class="w-full md:w-1/2 flex items-center justify-center p-6 md:p-12 lg:p-24 bg-surface-container-lowest overflow-y-auto">
<div class="w-full max-w-md space-y-8 glass-panel p-8 rounded-[16px] shadow-[0px_4px_20px_rgba(0,0,0,0.05)]">
<!-- Header -->
<div class="text-center space-y-2">
<span class="font-label-sm text-label-sm text-[#1e90ff] uppercase tracking-wider">Welcome Back</span>
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary-container">Sign in to SkyFly Elite</h1>
</div>
<!-- Info Banner -->
<div class="bg-surface-container-low border border-[#a5c8ff] rounded-lg p-4 flex items-start gap-3">
<span class="material-symbols-outlined text-[#0075d6] mt-0.5">info</span>
<div class="text-sm text-on-surface-variant flex-1">
                        Account not found. Please register first. 
                        <a class="text-[#0075d6] font-semibold hover:underline block mt-1" href="#">Create Account →</a>
</div>
</div>
<!-- Form -->
<form class="space-y-6" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant" for="email">Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface-bright text-on-surface input-focus-ring transition-all" id="email" placeholder="e.g. pilot@skyfly.com" required="" type="email"/>
</div>
</div>
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</span>
<input class="w-full pl-10 pr-12 py-3 rounded-lg border border-outline-variant bg-surface-bright text-on-surface input-focus-ring transition-all" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-secondary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer">
<input class="rounded border-outline-variant text-[#1e90ff] focus:ring-[#1e90ff] w-4 h-4" type="checkbox"/>
<span class="text-sm text-on-surface-variant">Remember me</span>
</label>
<a class="text-sm text-[#1e90ff] hover:underline font-medium" href="#">Forgot password?</a>
</div>
<button class="w-full bg-[#1e90ff] hover:bg-secondary-container text-on-primary font-label-sm text-label-sm py-4 rounded-[10px] transition-colors shadow-sm flex items-center justify-center gap-2" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-sm">login</span>
</button>
</form>
<!-- Footer -->
<div class="text-center pt-4 border-t border-outline-variant/30">
<p class="text-sm text-on-surface-variant">
                        Don't have an account? <a class="text-[#1e90ff] font-semibold hover:underline" href="#">Sign Up</a>
</p>
</div>
</div>
</div>
</main>
</body></html>
